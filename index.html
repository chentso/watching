<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now Playing</title>
  <style>
    :root {
      --bg: #0e1015;
      --card: #171a22;
      --text: #eef1f7;
      --muted: #8a93a6;
      --accent: #52b54b; /* Emby green */
      --paused: #f0b429;
      --off: #5b6375;
      --track: #2a2f3c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid #232838;
      border-radius: 18px;
      padding: 24px 26px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #20242f;
      font-weight: 600;
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
    .playing .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(82, 181, 75, .7); animation: pulse 1.6s infinite; }
    .paused .dot { background: var(--paused); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(82, 181, 75, .6); }
      70% { box-shadow: 0 0 0 8px rgba(82, 181, 75, 0); }
      100% { box-shadow: 0 0 0 0 rgba(82, 181, 75, 0); }
    }
    .main { display: flex; align-items: center; gap: 16px; }
    .icon {
      flex: none;
      width: 52px; height: 52px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: #222737;
      color: var(--off);
    }
    .playing .icon { color: var(--accent); }
    .paused .icon { color: var(--paused); }
    .icon svg { width: 24px; height: 24px; fill: currentColor; }
    .titles { min-width: 0; }
    .title {
      font-size: 20px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }
    .site { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .progress { margin-top: 22px; }
    .bar-wrap {
      position: relative;
      padding: 8px 0;
      margin: -8px 0;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .idle .bar-wrap, .live .bar-wrap {
      cursor: default;
      pointer-events: none;
    }
    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      transition: height .15s ease;
    }
    .bar-wrap:hover .bar, .scrubbing .bar {
      height: 10px;
    }
    .fill {
      position: absolute; inset: 0 auto 0 0;
      width: 0%;
      background: var(--off);
      border-radius: inherit;
      transition: width .25s linear;
    }
    .scrubbing .fill {
      transition: none !important;
    }
    .playing .fill { background: var(--accent); }
    .paused .fill { background: var(--paused); }
    .thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .6);
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease, left .25s linear;
      pointer-events: none;
    }
    .playing .thumb { border: 2px solid var(--accent); }
    .paused .thumb { border: 2px solid var(--paused); }
    .bar-wrap:hover .thumb, .scrubbing .thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }
    .scrubbing .thumb {
      transition: opacity .15s ease, transform .15s ease !important;
    }
    @media (hover: none) and (pointer: coarse) {
      .playing .thumb, .paused .thumb {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    .seek-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0%;
      transform: translateX(-50%);
      padding: 3px 7px;
      border-radius: 6px;
      background: #0b0d12;
      border: 1px solid #2b3142;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s ease;
    }
    .bar-wrap:hover .seek-tooltip, .scrubbing .seek-tooltip {
      opacity: 1;
    }
    .live .bar { overflow: hidden; }
    .live .thumb, .live .seek-tooltip { display: none; }
    .live .fill {
      width: 100% !important;
      background: repeating-linear-gradient(90deg, #e5484d 0 12px, #b8373b 12px 24px);
      background-size: 48px 100%;
      animation: slide 1.2s linear infinite;
    }
    .live.paused .fill { animation: none; }
    @keyframes slide { to { background-position: 48px 0; } }
    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 14px;
    }
    .times .now { color: var(--text); font-weight: 600; }
    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .idle .progress { opacity: .35; }
    .hidden { display: none !important; }
    .history {
      margin-top: 12px;
    }
    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #13161d;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      animation: fadeIn .25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .history-tag {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #202534;
      font-size: 12px;
    }
    .history-tag.rewind { background: rgba(94, 168, 255, .15); color: #6eb2ff; }
    .history-tag.forward { background: rgba(168, 130, 255, .15); color: #b99aff; }
    .history-tag.paused { background: rgba(240, 180, 41, .15); color: var(--paused); }
    .history-tag.resumed, .history-tag.started { background: rgba(82, 181, 75, .15); color: var(--accent); }
    .history-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #d7dce8;
    }
    .history-text strong {
      color: var(--text);
      font-weight: 600;
    }
    .history-ago {
      flex: none;
      color: var(--muted);
      font-size: 12px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .viewer-name, .seek-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #282e3f;
      background: #11141b;
      color: var(--text);
      font: inherit;
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom on focus */
    }
    .viewer-name::placeholder, .seek-input::placeholder { color: #636b7e; }
    .seek-row {
      display: flex;
      gap: 8px;
    }
    .seek-input {
      flex: 1;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }
    .seek-btn {
      flex: none;
      padding: 9px 16px;
      border: 1px solid rgba(168, 130, 255, .45);
      background: rgba(168, 130, 255, .16);
      color: #c5abff;
    }
    .seek-btn:hover:not(:disabled) {
      background: rgba(168, 130, 255, .26);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, opacity .15s, transform .08s;
    }
    .action-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .req-btn {
      border: 1px solid rgba(94, 168, 255, .4);
      background: rgba(94, 168, 255, .14);
      color: #7ab8ff;
    }
    .req-btn:hover:not(:disabled) {
      background: rgba(94, 168, 255, .24);
    }
    .pause-btn {
      border: 1px solid rgba(240, 180, 41, .45);
      background: rgba(240, 180, 41, .16);
      color: #f6c453;
    }
    .pause-btn:hover:not(:disabled) {
      background: rgba(240, 180, 41, .26);
    }
    .resume-btn {
      border: 1px solid rgba(82, 181, 75, .45);
      background: rgba(82, 181, 75, .16);
      color: #6fd368;
    }
    .resume-btn:hover:not(:disabled) {
      background: rgba(82, 181, 75, .26);
    }
    .skip-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .skip-btn {
      min-height: 40px;
      padding: 8px 6px;
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
      border: 1px solid rgba(168, 130, 255, .38);
      background: rgba(168, 130, 255, .13);
      color: #cbb5ff;
    }
    .skip-btn:hover:not(:disabled) {
      background: rgba(168, 130, 255, .24);
    }
    .action-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      border-color: #2a2f3c;
      background: #1f232e;
      color: var(--muted);
    }
    .tabs-bar {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #232838;
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #252b3b;
      background: #12151e;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tab-btn:hover {
      color: var(--text);
      background: #181c28;
    }
    .tab-btn.active {
      color: #6fd368;
      border-color: rgba(82, 181, 75, .45);
      background: rgba(82, 181, 75, .14);
    }
    .tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 18px;
      padding: 0 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .tab-btn.active .tab-count {
      background: rgba(82, 181, 75, .24);
      color: #9be895;
    }
    .chat, .history {
      margin-top: 12px;
    }
    .chat-name-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 8px 11px;
      border-radius: 10px;
      background: #11141b;
      border: 1px solid #252b3b;
    }
    .chat-field-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 170px;
      min-width: 0;
    }
    .chat-field-group.code-group {
      flex: 0 1 155px;
    }
    .chat-name-label {
      flex: none;
      color: #9ba3b5;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .chat-name-row .viewer-name,
    .chat-name-row .viewer-code {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #282e3f;
      background: #171b24;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }
    .chat-name-row .viewer-code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.08em;
      text-align: center;
      max-width: 96px;
    }
    .code-gate {
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(24, 29, 42, 0.96), rgba(17, 20, 29, 0.98));
      border: 1px solid rgba(122, 184, 255, 0.38);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .code-gate-title {
      font-size: 15px;
      font-weight: 650;
      color: #eef1f7;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .code-gate-desc {
      font-size: 13px;
      color: #9ba3b5;
      line-height: 1.4;
    }
    .code-gate-form {
      display: flex;
      gap: 8px;
    }
    .code-gate-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2d364d;
      background: #11141b;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-align: center;
    }
    .code-gate-input::placeholder {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: normal;
      color: #636b7e;
    }
    .code-gate-btn {
      flex: none;
      padding: 10px 18px;
      border: 1px solid rgba(94, 168, 255, 0.5);
      background: rgba(94, 168, 255, 0.2);
      color: #9ecaff;
    }
    .code-gate-btn:hover:not(:disabled) {
      background: rgba(94, 168, 255, 0.32);
    }
    .code-gate-err {
      color: #ff7b7f;
      font-size: 12.5px;
      font-weight: 500;
    }
    .chat-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px;
      border-radius: 12px;
      background: #11141b;
      border: 1px solid #222736;
    }
    .chat-empty {
      color: #636b7e;
      font-size: 13px;
      text-align: center;
      padding: 16px 8px;
    }
    .chat-msg {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #181c26;
      border: 1px solid rgba(255, 255, 255, .04);
      font-size: 13.5px;
      word-break: break-word;
    }
    .chat-msg.host {
      background: rgba(82, 181, 75, .12);
      border-color: rgba(82, 181, 75, .28);
    }
    .chat-msg.picker-open {
      border-color: rgba(122, 184, 255, .45);
    }
    .chat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }
    .chat-author {
      font-weight: 650;
      color: #7ab8ff;
    }
    .chat-msg.host .chat-author {
      color: #6fd368;
    }
    .chat-time {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .chat-text {
      color: var(--text);
      line-height: 1.38;
      white-space: pre-wrap;
    }
    .chat-msg-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
    }
    .chat-react-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .05);
      color: #d7dce8;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .chat-react-pill:hover {
      background: rgba(255, 255, 255, .14);
    }
    .chat-react-pill.active {
      border-color: rgba(94, 168, 255, .55);
      background: rgba(94, 168, 255, .2);
      color: #ffffff;
    }
    .chat-react-picker {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .chat-msg:hover .chat-react-picker,
      .chat-msg:focus-within .chat-react-picker {
        opacity: 1;
        pointer-events: auto;
      }
    }
    .chat-msg.picker-open .chat-react-picker {
      display: inline-flex;
      opacity: 1;
      pointer-events: auto;
      background: #202636;
      border: 1px solid rgba(122, 184, 255, .35);
      border-radius: 999px;
      padding: 3px 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
    }
    @media (hover: none), (pointer: coarse) {
      .chat-msg {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .chat-react-picker {
        display: none;
      }
      .chat-msg.picker-open .chat-react-picker {
        display: inline-flex;
      }
      .chat-react-btn {
        font-size: 18px;
        padding: 4px 7px;
      }
    }
    .chat-react-btn {
      border: none;
      background: transparent;
      padding: 2px 5px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background .12s, transform .1s;
    }
    .chat-react-btn:hover {
      background: rgba(255, 255, 255, .12);
      transform: scale(1.2);
    }
    .chat-emoji-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 9px;
      padding: 6px 10px;
      border-radius: 10px;
      background: #11141b;
      border: 1px solid #222736;
    }
    .chat-emoji-label {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
    }
    .chat-emoji-list {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chat-emoji-quick {
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(255, 255, 255, .04);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .12s, transform .1s;
    }
    .chat-emoji-quick:hover {
      background: rgba(255, 255, 255, .14);
      transform: translateY(-1px) scale(1.1);
    }
    .chat-emoji-quick:active {
      transform: scale(0.95);
    }
    .chat-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .chat-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #282e3f;
      background: #11141b;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }
    .chat-input::placeholder { color: #636b7e; }
    .chat-send-btn {
      flex: none;
      padding: 9px 16px;
      border: 1px solid rgba(82, 181, 75, .45);
      background: rgba(82, 181, 75, .18);
      color: #6fd368;
    }
    .chat-send-btn:hover:not(:disabled) {
      background: rgba(82, 181, 75, .28);
    }
    @media (max-width: 520px) {
      body {
        padding: 12px;
        align-items: start;
        padding-top: max(14px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .card {
        padding: 18px 16px 16px;
        border-radius: 16px;
      }
      .main { gap: 12px; }
      .icon { width: 44px; height: 44px; }
      .icon svg { width: 20px; height: 20px; }
      .title { font-size: 17px; }
      .site { font-size: 13px; }
      .btn-row { flex-wrap: wrap; }
      .btn-row .req-btn { flex-basis: 100%; }
      .history-list { max-height: 240px; }
      .history-item { align-items: flex-start; padding: 8px 10px; }
      .history-left { align-items: flex-start; }
      .history-text {
        white-space: normal;
        word-break: break-word;
        line-height: 1.35;
      }
    }
  </style>
</head>
<body>
  <main id="card" class="card idle" aria-live="polite">
    <div class="header">
      <span id="heading">Now Playing</span>
      <span class="badge"><span class="dot"></span><span id="status">Connecting…</span></span>
    </div>

    <div id="code-gate" class="code-gate hidden">
      <div class="code-gate-title">🔐 Security Code Required</div>
      <div class="code-gate-desc">Enter the security code shown at the top of the Host's player chat window to join and control playback.</div>
      <form id="code-gate-form" class="code-gate-form" autocomplete="off">
        <input id="code-gate-input" class="code-gate-input" type="text" inputmode="numeric" maxlength="12" placeholder="Enter security code" />
        <button id="code-gate-btn" class="action-btn code-gate-btn" type="submit">Unlock</button>
      </form>
      <div id="code-gate-err" class="code-gate-err hidden">Invalid security code. Please check with the Host.</div>
    </div>

    <div id="unlocked-body">
      <div class="main">
        <div class="icon" aria-hidden="true">
          <svg id="icon-play" class="hidden" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          <svg id="icon-idle" viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18z"/></svg>
        </div>
        <div class="titles">
          <div id="title" class="title">Waiting for a signal…</div>
          <div id="site" class="site"></div>
        </div>
      </div>

      <div class="progress">
        <div id="bar-wrap" class="bar-wrap" role="slider" aria-label="Seek video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="seek-tooltip" class="seek-tooltip">0:00</div>
          <div id="bar" class="bar">
            <div id="fill" class="fill"></div>
            <div id="thumb" class="thumb"></div>
          </div>
        </div>
        <div class="times">
          <span id="current" class="now">–:––</span>
          <span id="duration">–:––</span>
        </div>
      </div>

      <div class="controls">
        <div class="btn-row">
          <button id="request-pause-btn" class="action-btn req-btn" type="button" disabled>✋ Request Pause</button>
          <button id="pause-btn" class="action-btn pause-btn" type="button" disabled>⏸ Pause</button>
          <button id="resume-btn" class="action-btn resume-btn" type="button" disabled>▶ Resume</button>
        </div>
        <div id="skip-row" class="skip-row">
          <button class="action-btn skip-btn" type="button" data-skip="-10" disabled>⏪ -10s</button>
          <button class="action-btn skip-btn" type="button" data-skip="-5" disabled>⏪ -5s</button>
          <button class="action-btn skip-btn" type="button" data-skip="5" disabled>+5s ⏩</button>
          <button class="action-btn skip-btn" type="button" data-skip="10" disabled>+10s ⏩</button>
        </div>
        <form id="seek-form" class="seek-row" autocomplete="off">
          <input id="seek-input" class="seek-input" type="text" maxlength="20" placeholder="Jump to time (e.g. 12:30 or 1:05:00)" disabled />
          <button id="seek-btn" class="action-btn seek-btn" type="submit" disabled>🎯 Jump</button>
        </form>
      </div>

      <div class="footer">
        <span id="updated"></span>
        <span id="conn"></span>
      </div>

      <div class="tabs-bar" role="tablist">
        <button id="tab-btn-chat" class="tab-btn active" type="button" role="tab" aria-selected="true">
          <span>💬 Live Chat</span>
          <span id="chat-count" class="tab-count">0</span>
        </button>
        <button id="tab-btn-history" class="tab-btn" type="button" role="tab" aria-selected="false">
          <span>📜 Recent Activity</span>
          <span id="history-count" class="tab-count">0</span>
        </button>
      </div>

      <section id="chat-section" class="chat">
        <div class="chat-name-row">
          <div class="chat-field-group">
            <label class="chat-name-label" for="viewer-name">👤 Your name</label>
            <input id="viewer-name" class="viewer-name" type="text" maxlength="30" placeholder="Name (optional)" />
          </div>
          <div class="chat-field-group code-group">
            <label class="chat-name-label" for="viewer-code" title="Security code (can be updated anytime)">🔐 Code</label>
            <input id="viewer-code" class="viewer-code" type="text" inputmode="numeric" maxlength="12" placeholder="Code" />
          </div>
        </div>
        <div id="chat-list" class="chat-list">
          <div class="chat-empty">No messages yet — say hi!</div>
        </div>
        <div class="chat-emoji-bar">
          <span class="chat-emoji-label">Quick emoji</span>
          <div id="chat-emoji-list" class="chat-emoji-list">
            <button type="button" class="chat-emoji-quick" data-emoji="😂" title="Insert 😂">😂</button>
            <button type="button" class="chat-emoji-quick" data-emoji="❤️" title="Insert ❤️">❤️</button>
            <button type="button" class="chat-emoji-quick" data-emoji="🔥" title="Insert 🔥">🔥</button>
            <button type="button" class="chat-emoji-quick" data-emoji="😮" title="Insert 😮">😮</button>
            <button type="button" class="chat-emoji-quick" data-emoji="👏" title="Insert 👏">👏</button>
            <button type="button" class="chat-emoji-quick" data-emoji="😭" title="Insert 😭">😭</button>
          </div>
        </div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" class="chat-input" type="text" maxlength="500" placeholder="Write a message…" />
          <button id="chat-send-btn" class="action-btn chat-send-btn" type="submit">Send</button>
        </form>
      </section>

      <section id="history-section" class="history hidden">
        <ul id="history-list" class="history-list"></ul>
      </section>
    </div>
  </main>

  <script>
    'use strict';

    // How long without an update before we assume the broadcaster went away.
    // Paused background tabs can be heavily throttled by Chrome, so allow longer.
    const STALE_PLAYING_MS = 30_000;
    const STALE_PAUSED_MS = 150_000;

    const $ = (id) => document.getElementById(id);
    const card = $('card');
    const skipBtns = Array.from(document.querySelectorAll('.skip-btn'));

    let state = null;
    let history = [];
    let messages = [];
    let name = '';
    let clockOffset = 0; // serverNow - Date.now()
    let connected = false;
    let isScrubbing = false;
    let scrubTime = 0;
    let activeTab = 'chat';

    function switchTab(tab) {
      activeTab = tab === 'history' ? 'history' : 'chat';
      const isChat = activeTab === 'chat';
      $('tab-btn-chat').classList.toggle('active', isChat);
      $('tab-btn-chat').setAttribute('aria-selected', String(isChat));
      $('tab-btn-history').classList.toggle('active', !isChat);
      $('tab-btn-history').setAttribute('aria-selected', String(!isChat));
      $('chat-section').classList.toggle('hidden', !isChat);
      $('history-section').classList.toggle('hidden', isChat);
    }

    $('tab-btn-chat').addEventListener('click', () => switchTab('chat'));
    $('tab-btn-history').addEventListener('click', () => switchTab('history'));

    function fmt(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '–:––';
      const s = Math.floor(totalSeconds);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    }

    function parseTimeInput(raw) {
      const s = (raw || '').trim().toLowerCase();
      if (!s) return null;
      // Colon format: mm:ss or hh:mm:ss
      if (s.includes(':')) {
        const parts = s.split(':').map((p) => Number(p.trim()));
        if (parts.some((n) => !Number.isFinite(n) || n < 0)) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }
      // Unit format: e.g. 1h20m, 12m30s, 45s
      const unitMatch = s.match(/^(?:(\d+(?:\.\d+)?)h)?\s*(?:(\d+(?:\.\d+)?)m)?\s*(?:(\d+(?:\.\d+)?)s)?$/);
      if (unitMatch && (unitMatch[1] || unitMatch[2] || unitMatch[3])) {
        const h = Number(unitMatch[1] || 0);
        const m = Number(unitMatch[2] || 0);
        const sec = Number(unitMatch[3] || 0);
        return h * 3600 + m * 60 + sec;
      }
      // Plain seconds: e.g. "90"
      const numVal = Number(s);
      return Number.isFinite(numVal) && numVal >= 0 ? numVal : null;
    }

    function fmtDelta(seconds) {
      const s = Math.round(Math.abs(seconds));
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      const rem = s % 60;
      if (m < 60) return rem ? `${m}m ${rem}s` : `${m}m`;
      const h = Math.floor(m / 60);
      const remM = m % 60;
      return remM ? `${h}h ${remM}m` : `${h}h`;
    }

    function ago(ms) {
      const s = Math.round(Math.max(0, ms) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m} min ago`;
      return `${Math.round(m / 60)} h ago`;
    }

    function describeAction(item) {
      switch (item.type) {
        case 'rewind':
          return {
            icon: '⏪',
            cls: 'rewind',
            label: `Rewound ${fmtDelta(item.delta || (item.to - item.from))} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'forward':
          return {
            icon: '⏩',
            cls: 'forward',
            label: `Fast-forwarded ${fmtDelta(item.delta || (item.to - item.from))} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'paused':
          return {
            icon: '⏸',
            cls: 'paused',
            label: `Paused at ${fmt(item.at)}`,
          };
        case 'pause-requested':
          return {
            icon: '✋',
            cls: 'rewind',
            label: `${item.by || 'A viewer'} requested a pause at ${fmt(item.at)}`,
          };
        case 'viewer-paused':
          return {
            icon: '⏸',
            cls: 'paused',
            label: `${item.by || 'A viewer'} paused the video at ${fmt(item.at)}`,
          };
        case 'viewer-resumed':
          return {
            icon: '▶',
            cls: 'resumed',
            label: `${item.by || 'A viewer'} resumed the video at ${fmt(item.at)}`,
          };
        case 'viewer-seeked':
          return {
            icon: '🎯',
            cls: 'forward',
            label: `${item.by || 'A viewer'} jumped to ${fmt(item.to)} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'resumed':
          return {
            icon: '▶',
            cls: 'resumed',
            label: `Resumed at ${fmt(item.at)}`,
          };
        case 'started':
          return {
            icon: '▶',
            cls: 'started',
            label: item.title ? `Started watching "${item.title}"` : `Started watching at ${fmt(item.at)}`,
          };
        case 'switched':
          return {
            icon: '⏭',
            cls: 'started',
            label: item.title ? `Switched to "${item.title}"` : 'Switched video',
          };
        case 'rate':
          return {
            icon: '⚡',
            cls: 'forward',
            label: `Changed speed to ${item.rate}× at ${fmt(item.at)}`,
          };
        case 'ended':
          return {
            icon: '🏁',
            cls: 'paused',
            label: `Finished watching (${fmt(item.at)})`,
          };
        case 'stopped':
          return {
            icon: '◼',
            cls: 'paused',
            label: 'Closed player',
          };
        default:
          return { icon: '•', cls: '', label: item.type };
      }
    }

    function renderHistory(now) {
      const list = $('history-list');
      $('history-count').textContent = String(history ? history.length : 0);
      if (!history || history.length === 0) {
        if (list.dataset.sig !== 'empty') {
          list.dataset.sig = 'empty';
          list.innerHTML = '<li class="chat-empty">No recent activity yet.</li>';
        }
        return;
      }

      // Rebuild items if count or newest ID/timestamp changed; otherwise just update relative times
      const sig = history.map((h) => `${h.id}:${h.timestamp}:${h.to ?? ''}`).join('|');
      if (list.dataset.sig !== sig) {
        list.dataset.sig = sig;
        const frag = document.createDocumentFragment();
        for (const item of history) {
          const info = describeAction(item);
          const li = document.createElement('li');
          li.className = 'history-item';
          li.dataset.ts = String(item.timestamp);

          const left = document.createElement('div');
          left.className = 'history-left';

          const tag = document.createElement('span');
          tag.className = `history-tag ${info.cls}`;
          tag.textContent = info.icon;

          const text = document.createElement('span');
          text.className = 'history-text';
          text.textContent = info.label;
          text.title = info.label;

          left.append(tag, text);

          const timeEl = document.createElement('span');
          timeEl.className = 'history-ago';
          timeEl.textContent = ago(now - item.timestamp);

          li.append(left, timeEl);
          frag.appendChild(li);
        }
        list.replaceChildren(frag);
      } else {
        for (const li of list.children) {
          const ts = Number(li.dataset.ts);
          const timeEl = li.querySelector('.history-ago');
          if (timeEl && ts) timeEl.textContent = ago(now - ts);
        }
      }
    }

    const QUICK_EMOJIS = ['😂', '❤️', '🔥', '😮', '👏', '😭'];
    let openPickerMsgId = null;

    function syncOpenReactionPicker() {
      const list = $('chat-list');
      if (!list) return;
      for (const el of list.querySelectorAll('.chat-msg')) {
        const id = Number(el.dataset.msgId);
        el.classList.toggle('picker-open', openPickerMsgId != null && id === openPickerMsgId);
      }
    }

    async function toggleViewerReaction(messageId, emoji) {
      openPickerMsgId = null;
      syncOpenReactionPicker();
      try {
        await sendViewerAction('/api/chat/react', { messageId, emoji, role: 'viewer' });
      } catch (err) {
        console.warn('Reaction failed:', err);
      }
    }

    function renderChat() {
      const list = $('chat-list');
      $('chat-count').textContent = String(messages ? messages.length : 0);
      if (!messages || messages.length === 0) {
        if (list.dataset.sig !== 'empty') {
          list.dataset.sig = 'empty';
          list.innerHTML = '<div class="chat-empty">No messages yet — say hi!</div>';
        }
        return;
      }

      const myName = (($('viewer-name') && $('viewer-name').value) || '').trim() || 'Viewer';
      const sig = messages
        .map((m) => `${m.id}:${JSON.stringify(m.reactions || {})}`)
        .join('|') + `|me=${myName}|open=${openPickerMsgId ?? ''}`;
      if (list.dataset.sig === sig) return;
      const prevCount = Number(list.dataset.count || 0);
      const isNewMsg = messages.length > prevCount;
      const wasNearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
      const prevScrollTop = list.scrollTop;
      list.dataset.sig = sig;
      list.dataset.count = String(messages.length);

      const frag = document.createDocumentFragment();
      for (const m of messages) {
        const item = document.createElement('div');
        const isHost = m.role === 'host';
        const isPickerOpen = openPickerMsgId === m.id;
        item.className = `chat-msg ${isHost ? 'host' : 'viewer'}${isPickerOpen ? ' picker-open' : ''}`;
        item.dataset.msgId = String(m.id);

        const meta = document.createElement('div');
        meta.className = 'chat-meta';

        const author = document.createElement('span');
        author.className = 'chat-author';
        author.textContent = isHost ? `👑 ${m.by || name || 'Host'}` : (m.by || 'Viewer');

        const time = document.createElement('span');
        time.className = 'chat-time';
        const clock = m.timestamp
          ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : '';
        time.textContent = m.videoTime != null ? `@ ${fmt(m.videoTime)} · ${clock}` : clock;

        meta.append(author, time);

        const body = document.createElement('div');
        body.className = 'chat-text';
        body.textContent = m.text || '';

        const footer = document.createElement('div');
        footer.className = 'chat-msg-footer';

        const reactions = m.reactions && typeof m.reactions === 'object' ? m.reactions : {};
        for (const [em, users] of Object.entries(reactions)) {
          if (!Array.isArray(users) || users.length === 0) continue;
          const pill = document.createElement('button');
          pill.type = 'button';
          const iReacted = users.includes(myName);
          pill.className = `chat-react-pill${iReacted ? ' active' : ''}`;
          pill.textContent = `${em} ${users.length}`;
          pill.title = `Reacted by: ${users.join(', ')}`;
          pill.addEventListener('click', () => toggleViewerReaction(m.id, em));
          footer.appendChild(pill);
        }

        const picker = document.createElement('div');
        picker.className = 'chat-react-picker';
        for (const em of QUICK_EMOJIS) {
          const rb = document.createElement('button');
          rb.type = 'button';
          rb.className = 'chat-react-btn';
          rb.textContent = em;
          rb.title = `React with ${em}`;
          rb.addEventListener('click', () => toggleViewerReaction(m.id, em));
          picker.appendChild(rb);
        }
        footer.appendChild(picker);

        item.append(meta, body, footer);
        frag.appendChild(item);
      }
      list.replaceChildren(frag);
      if (isNewMsg || wasNearBottom) {
        list.scrollTop = list.scrollHeight;
      } else {
        list.scrollTop = prevScrollTop;
      }
    }

    // Long-press on mobile to open reaction emoji picker on a chat message
    let longPressTimer = null;
    let touchStartX = 0;
    let touchStartY = 0;

    $('chat-list').addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) return;
      const msgEl = e.target.closest('.chat-msg[data-msg-id]');
      if (!msgEl) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      const msgId = Number(msgEl.dataset.msgId);
      if (longPressTimer) clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        openPickerMsgId = openPickerMsgId === msgId ? null : msgId;
        syncOpenReactionPicker();
        try { if (navigator.vibrate) navigator.vibrate(15); } catch {}
      }, 420);
    }, { passive: true });

    $('chat-list').addEventListener('touchmove', (e) => {
      if (!longPressTimer) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      if (Math.hypot(t.clientX - touchStartX, t.clientY - touchStartY) > 10) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }, { passive: true });

    const cancelLongPress = () => {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    };
    $('chat-list').addEventListener('touchend', cancelLongPress, { passive: true });
    $('chat-list').addEventListener('touchcancel', cancelLongPress, { passive: true });
    $('chat-list').addEventListener('contextmenu', (e) => {
      if (e.target.closest('.chat-msg[data-msg-id]') && window.matchMedia('(hover: none), (pointer: coarse)').matches) {
        e.preventDefault();
      }
    });

    document.addEventListener('pointerdown', (e) => {
      if (openPickerMsgId == null) return;
      const inOpenMsg = e.target.closest(`.chat-msg[data-msg-id="${openPickerMsgId}"]`);
      if (!inOpenMsg) {
        openPickerMsgId = null;
        syncOpenReactionPicker();
      }
    });

    function setMode(mode) {
      card.classList.toggle('playing', mode === 'playing');
      card.classList.toggle('paused', mode === 'paused');
      card.classList.toggle('idle', mode === 'idle');
      $('icon-play').classList.toggle('hidden', mode !== 'playing');
      $('icon-pause').classList.toggle('hidden', mode !== 'paused');
      $('icon-idle').classList.toggle('hidden', mode !== 'idle');
    }

    function canSeek() {
      if (!codeVerified) return false;
      if (!state || !state.active || state.duration == null || state.duration <= 0) return false;
      const now = Date.now() + clockOffset;
      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      return !stale;
    }

    function currentPlayhead() {
      if (!state || !state.active) return 0;
      const now = Date.now() + clockOffset;
      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      let t = state.currentTime || 0;
      if (!state.paused && !stale) t += (age / 1000) * (state.playbackRate || 1);
      if (state.duration != null) t = Math.min(t, state.duration);
      return Math.max(0, t);
    }

    let codeVerified = false;
    let serverSessionId = '';
    let verifiedSessionId = '';
    let verifyingCode = false;

    function updateLockUI() {
      const locked = connected && !codeVerified;
      $('code-gate').classList.toggle('hidden', !locked);
      $('unlocked-body').classList.toggle('hidden', locked);
    }

    function render() {
      const now = Date.now() + clockOffset;
      $('heading').textContent = name ? `${name} is watching` : 'Now Playing';
      $('conn').textContent = connected ? '' : 'Reconnecting to server…';
      updateLockUI();

      if (connected && !codeVerified) {
        setMode('idle');
        $('status').textContent = 'Locked';
        document.title = '🔐 Security Code Required';
        return;
      }

      renderChat();
      renderHistory(now);

      if (!state || !state.active) {
        setMode('idle');
        card.classList.remove('live', 'scrubbing');
        isScrubbing = false;
        $('status').textContent = connected ? 'Offline' : 'Connecting…';
        $('title').textContent = 'Nothing playing right now';
        $('site').textContent = '';
        $('fill').style.width = '0%';
        $('thumb').style.left = '0%';
        $('current').textContent = '–:––';
        $('duration').textContent = '–:––';
        $('updated').textContent = state ? `Last activity ${ago(now - state.updatedAt)}` : '';
        $('request-pause-btn').disabled = true;
        $('request-pause-btn').textContent = '✋ Request Pause';
        $('pause-btn').disabled = true;
        $('pause-btn').textContent = '⏸ Pause';
        $('resume-btn').disabled = true;
        $('resume-btn').textContent = '▶ Resume';
        $('seek-input').disabled = true;
        $('seek-btn').disabled = true;
        for (const b of skipBtns) b.disabled = true;
        document.title = 'Now Playing';
        return;
      }

      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      const isLive = state.duration == null;

      // Interpolate the playhead between updates so the clock ticks smoothly.
      let t = state.currentTime;
      if (!state.paused && !stale) t += (age / 1000) * state.playbackRate;
      if (!isLive) t = Math.min(t, state.duration);
      const displayTime = isScrubbing ? scrubTime : t;

      const mode = stale ? 'idle' : state.paused ? 'paused' : 'playing';
      setMode(mode);
      card.classList.toggle('live', isLive && !stale);

      if (!reqCooldown) {
        $('request-pause-btn').disabled = mode !== 'playing';
        $('request-pause-btn').textContent = '✋ Request Pause';
      }
      $('pause-btn').disabled = mode !== 'playing';
      $('pause-btn').textContent = '⏸ Pause';
      $('resume-btn').disabled = mode !== 'paused';
      $('resume-btn').textContent = '▶ Resume';

      const seekable = !stale && !isLive;
      $('seek-input').disabled = !seekable;
      $('seek-btn').disabled = !seekable;
      for (const b of skipBtns) b.disabled = !seekable;

      $('status').textContent = stale ? 'Signal lost' : state.paused ? 'Paused' : isLive ? 'Live' : 'Playing';
      $('title').textContent = state.title || 'Something private 🤫';
      $('site').textContent = state.site || '';
      $('current').textContent = fmt(displayTime);
      $('duration').textContent = isLive ? 'LIVE' : fmt(state.duration);
      const pct = isLive ? 100 : Math.min(100, Math.max(0, (displayTime / state.duration) * 100));
      $('fill').style.width = `${pct.toFixed(2)}%`;
      $('thumb').style.left = `${pct.toFixed(2)}%`;
      $('bar-wrap').setAttribute('aria-valuenow', String(Math.round(pct)));
      $('updated').textContent = `Updated ${ago(age)}` +
        (state.playbackRate && state.playbackRate !== 1 ? ` · ${state.playbackRate}×` : '');

      const glyph = mode === 'playing' ? '▶' : mode === 'paused' ? '⏸' : '◼';
      document.title = `${glyph} ${state.title || 'Now Playing'}`;
    }

    function onState(json) {
      const data = JSON.parse(json);
      clockOffset = data.serverNow - Date.now();
      state = data.state;
      history = Array.isArray(data.history) ? data.history : [];
      messages = Array.isArray(data.messages) ? data.messages : [];
      name = data.name || '';
      connected = true;
      if (data.codeSessionId && data.codeSessionId !== serverSessionId) {
        serverSessionId = data.codeSessionId;
        if (verifiedSessionId !== serverSessionId) {
          verifySecurityCode(getStoredCode(), false);
        }
      } else if (!data.codeSessionId && !codeVerified) {
        verifySecurityCode(getStoredCode(), false);
      }
      render();
    }

    // Same-origin mode: page is served by the relay itself.
    function connectSameOrigin() {
      const es = new EventSource('events');
      es.addEventListener('open', () => { connected = true; render(); });
      es.addEventListener('error', () => { connected = false; render(); }); // EventSource auto-reconnects
      es.addEventListener('state', (e) => onState(e.data));
    }

    // Remote mode: page is hosted elsewhere (e.g. GitHub Pages) and opened with
    // ?server=https://xxxx-8787.usw2.devtunnels.ms . EventSource can't send custom
    // headers, so stream the SSE response with fetch() and add the headers that
    // tell Dev Tunnels / ngrok to skip their browser warning pages.
    async function connectRemote(base) {
      const url = `${base.replace(/\/+$/, '')}/events`;
      for (;;) {
        try {
          const res = await fetch(url, {
            cache: 'no-store',
            headers: {
              Accept: 'text/event-stream',
              'X-Tunnel-Skip-AntiPhishing-Page': 'True',
              'ngrok-skip-browser-warning': '1',
              'bypass-tunnel-reminder': '1',
            },
          });
          if (!res.ok || !(res.headers.get('content-type') || '').includes('text/event-stream')) {
            throw new Error(`Unexpected response (${res.status})`);
          }
          connected = true;
          render();
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split(/\r?\n\r?\n/);
            buffer = events.pop();
            for (const block of events) {
              let type = 'message';
              const data = [];
              for (const line of block.split(/\r?\n/)) {
                if (line.startsWith('event:')) type = line.slice(6).trim();
                else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
              }
              if (type === 'state' && data.length) onState(data.join('\n'));
            }
          }
        } catch (err) {
          console.warn('Stream error:', err);
        }
        connected = false;
        render();
        await new Promise((r) => setTimeout(r, 3000));
      }
    }

    // If this page is hosted on a static site (Netlify Drop, GitHub Pages, etc.) or opened
    // as a local file, automatically connect to your permanent Dev Tunnel in the background
    // with the skip-warning header so friends never see any interstitial page.
    const DEFAULT_TUNNEL_URL = 'https://0wlgwzvr-8787.usw2.devtunnels.ms';
    const isServedByRelay =
      location.port === '8787' ||
      /\.devtunnels\.ms$|\.lhr\.life$|\.loca\.lt$|\.ngrok/i.test(location.hostname);
    const remoteServer =
      new URLSearchParams(location.search).get('server') ||
      (!isServedByRelay ? DEFAULT_TUNNEL_URL : null);
    const apiBase = remoteServer ? remoteServer.replace(/\/+$/, '') : '';
    let reqCooldown = false;

    function getStoredCode() {
      try {
        return ($('viewer-code').value || localStorage.getItem('np_security_code') || '').trim();
      } catch {
        return ($('viewer-code').value || '').trim();
      }
    }

    function setStoredCode(code) {
      const cleaned = String(code || '').trim();
      $('viewer-code').value = cleaned;
      $('code-gate-input').value = cleaned;
      try {
        localStorage.setItem('np_security_code', cleaned);
      } catch {}
    }

    async function verifySecurityCode(codeToTry, showErrOnFail = true) {
      const cleaned = String(codeToTry || '').trim();
      if (!cleaned) {
        codeVerified = false;
        verifiedSessionId = '';
        if (showErrOnFail) $('code-gate-err').classList.remove('hidden');
        render();
        return false;
      }
      if (verifyingCode) return false;
      verifyingCode = true;
      try {
        const res = await fetch(`${apiBase}/api/verify-code`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Security-Code': cleaned,
            'X-Tunnel-Skip-AntiPhishing-Page': 'True',
            'ngrok-skip-browser-warning': '1',
            'bypass-tunnel-reminder': '1',
          },
          body: JSON.stringify({ code: cleaned }),
        });
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          setStoredCode(cleaned);
          codeVerified = true;
          verifiedSessionId = data.codeSessionId || serverSessionId || 'ok';
          $('code-gate-err').classList.add('hidden');
          $('viewer-code').style.borderColor = '';
          render();
          return true;
        }
        codeVerified = false;
        verifiedSessionId = '';
        if (showErrOnFail) {
          $('code-gate-err').classList.remove('hidden');
        }
        render();
        return false;
      } catch (err) {
        console.warn('Code verification error:', err);
        return false;
      } finally {
        verifyingCode = false;
      }
    }

    try {
      $('viewer-name').value = localStorage.getItem('np_viewer_name') || '';
      $('viewer-name').addEventListener('input', (e) => {
        try { localStorage.setItem('np_viewer_name', e.target.value.trim()); } catch {}
        renderChat();
      });
      const initialCode = localStorage.getItem('np_security_code') || '';
      $('viewer-code').value = initialCode;
      $('code-gate-input').value = initialCode;
    } catch {}

    let codeInputTimer = null;
    $('viewer-code').addEventListener('input', (e) => {
      const val = (e.target.value || '').trim();
      $('code-gate-input').value = val;
      try { localStorage.setItem('np_security_code', val); } catch {}
      if (codeInputTimer) clearTimeout(codeInputTimer);
      codeInputTimer = setTimeout(async () => {
        if (!val) return;
        const ok = await verifySecurityCode(val, false);
        $('viewer-code').style.borderColor = ok ? '#52b54b' : '#e5484d';
        if (ok) {
          setTimeout(() => { $('viewer-code').style.borderColor = ''; }, 1200);
        }
      }, 450);
    });

    $('code-gate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = ($('code-gate-input').value || '').trim();
      const ok = await verifySecurityCode(val, true);
      if (!ok) {
        $('code-gate-input').focus();
        $('code-gate-input').select();
      }
    });

    async function sendViewerAction(endpoint, extra = {}) {
      const by = ($('viewer-name').value || '').trim();
      const code = getStoredCode();
      const res = await fetch(`${apiBase}${endpoint}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Security-Code': code,
          'X-Tunnel-Skip-AntiPhishing-Page': 'True',
          'ngrok-skip-browser-warning': '1',
          'bypass-tunnel-reminder': '1',
        },
        body: JSON.stringify({ by, code, ...extra }),
      });
      if (res.status === 401) {
        codeVerified = false;
        verifiedSessionId = '';
        $('code-gate-err').classList.remove('hidden');
        render();
        setTimeout(() => $('code-gate-input').focus(), 50);
        throw new Error('Invalid security code');
      }
      return res;
    }

    async function performSeek(targetSeconds) {
      if (!canSeek()) return;
      const clamped = Math.max(0, Math.min(state.duration, targetSeconds));
      // Optimistically update local playhead so UI stays where the user seeked
      state.currentTime = clamped;
      state.updatedAt = Date.now() + clockOffset;
      render();
      try {
        await sendViewerAction('/api/seek', { to: clamped });
      } catch (err) {
        console.warn('Seek failed:', err);
      }
    }

    // Interactive Seek Bar (mouse + touch via Pointer Events)
    const barWrap = $('bar-wrap');
    const barEl = $('bar');
    const tooltip = $('seek-tooltip');

    function ratioFromEvent(e) {
      const rect = barEl.getBoundingClientRect();
      if (!rect.width) return 0;
      return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    }

    function updateTooltip(ratio) {
      if (!canSeek()) return;
      const pct = ratio * 100;
      tooltip.style.left = `${pct.toFixed(2)}%`;
      tooltip.textContent = fmt(ratio * state.duration);
    }

    barWrap.addEventListener('pointermove', (e) => {
      if (!canSeek()) return;
      const ratio = ratioFromEvent(e);
      updateTooltip(ratio);
      if (isScrubbing) {
        scrubTime = ratio * state.duration;
        render();
      }
    });

    barWrap.addEventListener('pointerdown', (e) => {
      if (!canSeek() || (e.button != null && e.button !== 0)) return;
      e.preventDefault();
      isScrubbing = true;
      card.classList.add('scrubbing');
      try { barWrap.setPointerCapture(e.pointerId); } catch {}
      const ratio = ratioFromEvent(e);
      scrubTime = ratio * state.duration;
      updateTooltip(ratio);
      render();
    });

    function finishScrub(e) {
      if (!isScrubbing) return;
      const ratio = ratioFromEvent(e);
      const target = ratio * (state && state.duration ? state.duration : 0);
      isScrubbing = false;
      card.classList.remove('scrubbing');
      try { barWrap.releasePointerCapture(e.pointerId); } catch {}
      performSeek(target);
    }

    barWrap.addEventListener('pointerup', finishScrub);
    barWrap.addEventListener('pointercancel', () => {
      if (!isScrubbing) return;
      isScrubbing = false;
      card.classList.remove('scrubbing');
      render();
    });

    // Quick-skip buttons (-10s, -5s, +5s, +10s)
    $('skip-row').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-skip]');
      if (!btn || btn.disabled || !canSeek()) return;
      const delta = Number(btn.getAttribute('data-skip'));
      if (!Number.isFinite(delta) || delta === 0) return;
      await performSeek(currentPlayhead() + delta);
    });

    // Jump to specific time form
    $('seek-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!canSeek()) return;
      const input = $('seek-input');
      const target = parseTimeInput(input.value);
      if (target == null || target > state.duration) {
        input.style.borderColor = '#e5484d';
        setTimeout(() => { input.style.borderColor = ''; }, 1200);
        return;
      }
      input.value = '';
      input.blur();
      await performSeek(target);
    });

    $('request-pause-btn').addEventListener('click', async () => {
      const btn = $('request-pause-btn');
      reqCooldown = true;
      btn.disabled = true;
      btn.textContent = '✋ Request Sent!';
      try {
        await sendViewerAction('/api/request-pause');
      } catch (err) {
        console.warn('Pause request failed:', err);
      }
      setTimeout(() => {
        reqCooldown = false;
        render();
      }, 2500);
    });

    $('pause-btn').addEventListener('click', async () => {
      const btn = $('pause-btn');
      btn.disabled = true;
      btn.textContent = 'Pausing…';
      try {
        await sendViewerAction('/api/pause');
      } catch (err) {
        console.warn('Pause failed:', err);
        render();
      }
    });

    $('resume-btn').addEventListener('click', async () => {
      const btn = $('resume-btn');
      btn.disabled = true;
      btn.textContent = 'Resuming…';
      try {
        await sendViewerAction('/api/resume');
      } catch (err) {
        console.warn('Resume failed:', err);
        render();
      }
    });

    $('chat-emoji-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-emoji]');
      if (!btn) return;
      const em = btn.getAttribute('data-emoji') || '';
      const input = $('chat-input');
      const start = input.selectionStart != null ? input.selectionStart : input.value.length;
      const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + em + input.value.slice(end);
      input.focus();
      const cursor = start + em.length;
      try { input.setSelectionRange(cursor, cursor); } catch {}
    });

    $('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('chat-input');
      const text = (input.value || '').trim();
      if (!text) return;
      input.value = '';
      try {
        await sendViewerAction('/api/chat', { text, role: 'viewer' });
      } catch (err) {
        console.warn('Chat send failed:', err);
      }
    });

    if (remoteServer) connectRemote(remoteServer);
    else connectSameOrigin();
    setInterval(render, 250);
  </script>
</body>
</html>
