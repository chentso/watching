<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now Playing</title>
  <style>
    :root {
      --bg: #0e1015;
      --card: #171a22;
      --text: #eef1f7;
      --muted: #8a93a6;
      --accent: #52b54b; /* Emby green */
      --paused: #f0b429;
      --off: #5b6375;
      --track: #2a2f3c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid #232838;
      border-radius: 18px;
      padding: 24px 26px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #20242f;
      font-weight: 600;
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
    .playing .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(82, 181, 75, .7); animation: pulse 1.6s infinite; }
    .paused .dot { background: var(--paused); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(82, 181, 75, .6); }
      70% { box-shadow: 0 0 0 8px rgba(82, 181, 75, 0); }
      100% { box-shadow: 0 0 0 0 rgba(82, 181, 75, 0); }
    }
    .main { display: flex; align-items: center; gap: 16px; }
    .icon {
      flex: none;
      width: 52px; height: 52px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: #222737;
      color: var(--off);
    }
    .playing .icon { color: var(--accent); }
    .paused .icon { color: var(--paused); }
    .icon svg { width: 24px; height: 24px; fill: currentColor; }
    .titles { min-width: 0; }
    .title {
      font-size: 20px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }
    .site { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .progress { margin-top: 22px; }
    .bar-wrap {
      position: relative;
      padding: 8px 0;
      margin: -8px 0;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .idle .bar-wrap, .live .bar-wrap {
      cursor: default;
      pointer-events: none;
    }
    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      transition: height .15s ease;
    }
    .bar-wrap:hover .bar, .scrubbing .bar {
      height: 10px;
    }
    .fill {
      position: absolute; inset: 0 auto 0 0;
      width: 0%;
      background: var(--off);
      border-radius: inherit;
      transition: width .25s linear;
    }
    .scrubbing .fill {
      transition: none !important;
    }
    .playing .fill { background: var(--accent); }
    .paused .fill { background: var(--paused); }
    .thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .6);
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease, left .25s linear;
      pointer-events: none;
    }
    .playing .thumb { border: 2px solid var(--accent); }
    .paused .thumb { border: 2px solid var(--paused); }
    .bar-wrap:hover .thumb, .scrubbing .thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }
    .scrubbing .thumb {
      transition: opacity .15s ease, transform .15s ease !important;
    }
    @media (hover: none) and (pointer: coarse) {
      .playing .thumb, .paused .thumb {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    .seek-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0%;
      transform: translateX(-50%);
      padding: 3px 7px;
      border-radius: 6px;
      background: #0b0d12;
      border: 1px solid #2b3142;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s ease;
    }
    .bar-wrap:hover .seek-tooltip, .scrubbing .seek-tooltip {
      opacity: 1;
    }
    .live .bar { overflow: hidden; }
    .live .thumb, .live .seek-tooltip { display: none; }
    .live .fill {
      width: 100% !important;
      background: repeating-linear-gradient(90deg, #e5484d 0 12px, #b8373b 12px 24px);
      background-size: 48px 100%;
      animation: slide 1.2s linear infinite;
    }
    .live.paused .fill { animation: none; }
    @keyframes slide { to { background-position: 48px 0; } }
    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 14px;
    }
    .times .now { color: var(--text); font-weight: 600; }
    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .idle .progress { opacity: .35; }
    .hidden { display: none !important; }
    .history {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #232838;
    }
    .history-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 210px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #13161d;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      animation: fadeIn .25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .history-tag {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #202534;
      font-size: 12px;
    }
    .history-tag.rewind { background: rgba(94, 168, 255, .15); color: #6eb2ff; }
    .history-tag.forward { background: rgba(168, 130, 255, .15); color: #b99aff; }
    .history-tag.paused { background: rgba(240, 180, 41, .15); color: var(--paused); }
    .history-tag.resumed, .history-tag.started { background: rgba(82, 181, 75, .15); color: var(--accent); }
    .history-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #d7dce8;
    }
    .history-text strong {
      color: var(--text);
      font-weight: 600;
    }
    .history-ago {
      flex: none;
      color: var(--muted);
      font-size: 12px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .viewer-name, .seek-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #282e3f;
      background: #11141b;
      color: var(--text);
      font: inherit;
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom on focus */
    }
    .viewer-name::placeholder, .seek-input::placeholder { color: #636b7e; }
    .seek-row {
      display: flex;
      gap: 8px;
    }
    .seek-input {
      flex: 1;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }
    .seek-btn {
      flex: none;
      padding: 9px 16px;
      border: 1px solid rgba(168, 130, 255, .45);
      background: rgba(168, 130, 255, .16);
      color: #c5abff;
    }
    .seek-btn:hover:not(:disabled) {
      background: rgba(168, 130, 255, .26);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, opacity .15s, transform .08s;
    }
    .action-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .req-btn {
      border: 1px solid rgba(94, 168, 255, .4);
      background: rgba(94, 168, 255, .14);
      color: #7ab8ff;
    }
    .req-btn:hover:not(:disabled) {
      background: rgba(94, 168, 255, .24);
    }
    .pause-btn {
      border: 1px solid rgba(240, 180, 41, .45);
      background: rgba(240, 180, 41, .16);
      color: #f6c453;
    }
    .pause-btn:hover:not(:disabled) {
      background: rgba(240, 180, 41, .26);
    }
    .resume-btn {
      border: 1px solid rgba(82, 181, 75, .45);
      background: rgba(82, 181, 75, .16);
      color: #6fd368;
    }
    .resume-btn:hover:not(:disabled) {
      background: rgba(82, 181, 75, .26);
    }
    .action-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      border-color: #2a2f3c;
      background: #1f232e;
      color: var(--muted);
    }
    @media (max-width: 520px) {
      body {
        padding: 12px;
        align-items: start;
        padding-top: max(14px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .card {
        padding: 18px 16px 16px;
        border-radius: 16px;
      }
      .main { gap: 12px; }
      .icon { width: 44px; height: 44px; }
      .icon svg { width: 20px; height: 20px; }
      .title { font-size: 17px; }
      .site { font-size: 13px; }
      .btn-row { flex-wrap: wrap; }
      .btn-row .req-btn { flex-basis: 100%; }
      .history-list { max-height: 240px; }
      .history-item { align-items: flex-start; padding: 8px 10px; }
      .history-left { align-items: flex-start; }
      .history-text {
        white-space: normal;
        word-break: break-word;
        line-height: 1.35;
      }
    }
  </style>
</head>
<body>
  <main id="card" class="card idle" aria-live="polite">
    <div class="header">
      <span id="heading">Now Playing</span>
      <span class="badge"><span class="dot"></span><span id="status">Connecting…</span></span>
    </div>

    <div class="main">
      <div class="icon" aria-hidden="true">
        <svg id="icon-play" class="hidden" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
        <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <svg id="icon-idle" viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18z"/></svg>
      </div>
      <div class="titles">
        <div id="title" class="title">Waiting for a signal…</div>
        <div id="site" class="site"></div>
      </div>
    </div>

    <div class="progress">
      <div id="bar-wrap" class="bar-wrap" role="slider" aria-label="Seek video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="seek-tooltip" class="seek-tooltip">0:00</div>
        <div id="bar" class="bar">
          <div id="fill" class="fill"></div>
          <div id="thumb" class="thumb"></div>
        </div>
      </div>
      <div class="times">
        <span id="current" class="now">–:––</span>
        <span id="duration">–:––</span>
      </div>
    </div>

    <div class="controls">
      <input id="viewer-name" class="viewer-name" type="text" maxlength="30" placeholder="Your name (optional)" />
      <div class="btn-row">
        <button id="request-pause-btn" class="action-btn req-btn" type="button" disabled>✋ Request Pause</button>
        <button id="pause-btn" class="action-btn pause-btn" type="button" disabled>⏸ Pause</button>
        <button id="resume-btn" class="action-btn resume-btn" type="button" disabled>▶ Resume</button>
      </div>
      <form id="seek-form" class="seek-row" autocomplete="off">
        <input id="seek-input" class="seek-input" type="text" maxlength="20" placeholder="Jump to time (e.g. 12:30 or 1:05:00)" disabled />
        <button id="seek-btn" class="action-btn seek-btn" type="submit" disabled>🎯 Jump</button>
      </form>
    </div>

    <div class="footer">
      <span id="updated"></span>
      <span id="conn"></span>
    </div>

    <section id="history-section" class="history hidden">
      <div class="history-title">Recent Activity</div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>

  <script>
    'use strict';

    // How long without an update before we assume the broadcaster went away.
    // Paused background tabs can be heavily throttled by Chrome, so allow longer.
    const STALE_PLAYING_MS = 30_000;
    const STALE_PAUSED_MS = 150_000;

    const $ = (id) => document.getElementById(id);
    const card = $('card');

    let state = null;
    let history = [];
    let name = '';
    let clockOffset = 0; // serverNow - Date.now()
    let connected = false;
    let isScrubbing = false;
    let scrubTime = 0;

    function fmt(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '–:––';
      const s = Math.floor(totalSeconds);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    }

    function parseTimeInput(raw) {
      const s = (raw || '').trim().toLowerCase();
      if (!s) return null;
      // Colon format: mm:ss or hh:mm:ss
      if (s.includes(':')) {
        const parts = s.split(':').map((p) => Number(p.trim()));
        if (parts.some((n) => !Number.isFinite(n) || n < 0)) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }
      // Unit format: e.g. 1h20m, 12m30s, 45s
      const unitMatch = s.match(/^(?:(\d+(?:\.\d+)?)h)?\s*(?:(\d+(?:\.\d+)?)m)?\s*(?:(\d+(?:\.\d+)?)s)?$/);
      if (unitMatch && (unitMatch[1] || unitMatch[2] || unitMatch[3])) {
        const h = Number(unitMatch[1] || 0);
        const m = Number(unitMatch[2] || 0);
        const sec = Number(unitMatch[3] || 0);
        return h * 3600 + m * 60 + sec;
      }
      // Plain seconds: e.g. "90"
      const numVal = Number(s);
      return Number.isFinite(numVal) && numVal >= 0 ? numVal : null;
    }

    function fmtDelta(seconds) {
      const s = Math.round(Math.abs(seconds));
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      const rem = s % 60;
      if (m < 60) return rem ? `${m}m ${rem}s` : `${m}m`;
      const h = Math.floor(m / 60);
      const remM = m % 60;
      return remM ? `${h}h ${remM}m` : `${h}h`;
    }

    function ago(ms) {
      const s = Math.round(Math.max(0, ms) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m} min ago`;
      return `${Math.round(m / 60)} h ago`;
    }

    function describeAction(item) {
      switch (item.type) {
        case 'rewind':
          return {
            icon: '⏪',
            cls: 'rewind',
            label: `Rewound ${fmtDelta(item.delta || (item.to - item.from))} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'forward':
          return {
            icon: '⏩',
            cls: 'forward',
            label: `Fast-forwarded ${fmtDelta(item.delta || (item.to - item.from))} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'paused':
          return {
            icon: '⏸',
            cls: 'paused',
            label: `Paused at ${fmt(item.at)}`,
          };
        case 'pause-requested':
          return {
            icon: '✋',
            cls: 'rewind',
            label: `${item.by || 'A viewer'} requested a pause at ${fmt(item.at)}`,
          };
        case 'viewer-paused':
          return {
            icon: '⏸',
            cls: 'paused',
            label: `${item.by || 'A viewer'} paused the video at ${fmt(item.at)}`,
          };
        case 'viewer-resumed':
          return {
            icon: '▶',
            cls: 'resumed',
            label: `${item.by || 'A viewer'} resumed the video at ${fmt(item.at)}`,
          };
        case 'viewer-seeked':
          return {
            icon: '🎯',
            cls: 'forward',
            label: `${item.by || 'A viewer'} jumped to ${fmt(item.to)} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'resumed':
          return {
            icon: '▶',
            cls: 'resumed',
            label: `Resumed at ${fmt(item.at)}`,
          };
        case 'started':
          return {
            icon: '▶',
            cls: 'started',
            label: item.title ? `Started watching "${item.title}"` : `Started watching at ${fmt(item.at)}`,
          };
        case 'switched':
          return {
            icon: '⏭',
            cls: 'started',
            label: item.title ? `Switched to "${item.title}"` : 'Switched video',
          };
        case 'rate':
          return {
            icon: '⚡',
            cls: 'forward',
            label: `Changed speed to ${item.rate}× at ${fmt(item.at)}`,
          };
        case 'ended':
          return {
            icon: '🏁',
            cls: 'paused',
            label: `Finished watching (${fmt(item.at)})`,
          };
        case 'stopped':
          return {
            icon: '◼',
            cls: 'paused',
            label: 'Closed player',
          };
        default:
          return { icon: '•', cls: '', label: item.type };
      }
    }

    function renderHistory(now) {
      const section = $('history-section');
      const list = $('history-list');
      if (!history || history.length === 0) {
        section.classList.add('hidden');
        list.replaceChildren();
        return;
      }
      section.classList.remove('hidden');

      // Rebuild items if count or newest ID/timestamp changed; otherwise just update relative times
      const sig = history.map((h) => `${h.id}:${h.timestamp}:${h.to ?? ''}`).join('|');
      if (list.dataset.sig !== sig) {
        list.dataset.sig = sig;
        const frag = document.createDocumentFragment();
        for (const item of history) {
          const info = describeAction(item);
          const li = document.createElement('li');
          li.className = 'history-item';
          li.dataset.ts = String(item.timestamp);

          const left = document.createElement('div');
          left.className = 'history-left';

          const tag = document.createElement('span');
          tag.className = `history-tag ${info.cls}`;
          tag.textContent = info.icon;

          const text = document.createElement('span');
          text.className = 'history-text';
          text.textContent = info.label;
          text.title = info.label;

          left.append(tag, text);

          const timeEl = document.createElement('span');
          timeEl.className = 'history-ago';
          timeEl.textContent = ago(now - item.timestamp);

          li.append(left, timeEl);
          frag.appendChild(li);
        }
        list.replaceChildren(frag);
      } else {
        for (const li of list.children) {
          const ts = Number(li.dataset.ts);
          const timeEl = li.querySelector('.history-ago');
          if (timeEl && ts) timeEl.textContent = ago(now - ts);
        }
      }
    }

    function setMode(mode) {
      card.classList.toggle('playing', mode === 'playing');
      card.classList.toggle('paused', mode === 'paused');
      card.classList.toggle('idle', mode === 'idle');
      $('icon-play').classList.toggle('hidden', mode !== 'playing');
      $('icon-pause').classList.toggle('hidden', mode !== 'paused');
      $('icon-idle').classList.toggle('hidden', mode !== 'idle');
    }

    function canSeek() {
      if (!state || !state.active || state.duration == null || state.duration <= 0) return false;
      const now = Date.now() + clockOffset;
      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      return !stale;
    }

    function render() {
      const now = Date.now() + clockOffset;
      $('heading').textContent = name ? `${name} is watching` : 'Now Playing';
      $('conn').textContent = connected ? '' : 'Reconnecting to server…';
      renderHistory(now);

      if (!state || !state.active) {
        setMode('idle');
        card.classList.remove('live', 'scrubbing');
        isScrubbing = false;
        $('status').textContent = connected ? 'Offline' : 'Connecting…';
        $('title').textContent = 'Nothing playing right now';
        $('site').textContent = '';
        $('fill').style.width = '0%';
        $('thumb').style.left = '0%';
        $('current').textContent = '–:––';
        $('duration').textContent = '–:––';
        $('updated').textContent = state ? `Last activity ${ago(now - state.updatedAt)}` : '';
        $('request-pause-btn').disabled = true;
        $('request-pause-btn').textContent = '✋ Request Pause';
        $('pause-btn').disabled = true;
        $('pause-btn').textContent = '⏸ Pause';
        $('resume-btn').disabled = true;
        $('resume-btn').textContent = '▶ Resume';
        $('seek-input').disabled = true;
        $('seek-btn').disabled = true;
        document.title = 'Now Playing';
        return;
      }

      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      const isLive = state.duration == null;

      // Interpolate the playhead between updates so the clock ticks smoothly.
      let t = state.currentTime;
      if (!state.paused && !stale) t += (age / 1000) * state.playbackRate;
      if (!isLive) t = Math.min(t, state.duration);
      const displayTime = isScrubbing ? scrubTime : t;

      const mode = stale ? 'idle' : state.paused ? 'paused' : 'playing';
      setMode(mode);
      card.classList.toggle('live', isLive && !stale);

      if (!reqCooldown) {
        $('request-pause-btn').disabled = mode !== 'playing';
        $('request-pause-btn').textContent = '✋ Request Pause';
      }
      $('pause-btn').disabled = mode !== 'playing';
      $('pause-btn').textContent = '⏸ Pause';
      $('resume-btn').disabled = mode !== 'paused';
      $('resume-btn').textContent = '▶ Resume';

      const seekable = !stale && !isLive;
      $('seek-input').disabled = !seekable;
      $('seek-btn').disabled = !seekable;

      $('status').textContent = stale ? 'Signal lost' : state.paused ? 'Paused' : isLive ? 'Live' : 'Playing';
      $('title').textContent = state.title || 'Something private 🤫';
      $('site').textContent = state.site || '';
      $('current').textContent = fmt(displayTime);
      $('duration').textContent = isLive ? 'LIVE' : fmt(state.duration);
      const pct = isLive ? 100 : Math.min(100, Math.max(0, (displayTime / state.duration) * 100));
      $('fill').style.width = `${pct.toFixed(2)}%`;
      $('thumb').style.left = `${pct.toFixed(2)}%`;
      $('bar-wrap').setAttribute('aria-valuenow', String(Math.round(pct)));
      $('updated').textContent = `Updated ${ago(age)}` +
        (state.playbackRate && state.playbackRate !== 1 ? ` · ${state.playbackRate}×` : '');

      const glyph = mode === 'playing' ? '▶' : mode === 'paused' ? '⏸' : '◼';
      document.title = `${glyph} ${state.title || 'Now Playing'}`;
    }

    function onState(json) {
      const data = JSON.parse(json);
      clockOffset = data.serverNow - Date.now();
      state = data.state;
      history = Array.isArray(data.history) ? data.history : [];
      name = data.name || '';
      connected = true;
      render();
    }

    // Same-origin mode: page is served by the relay itself.
    function connectSameOrigin() {
      const es = new EventSource('events');
      es.addEventListener('open', () => { connected = true; render(); });
      es.addEventListener('error', () => { connected = false; render(); }); // EventSource auto-reconnects
      es.addEventListener('state', (e) => onState(e.data));
    }

    // Remote mode: page is hosted elsewhere (e.g. GitHub Pages) and opened with
    // ?server=https://xxxx-8787.usw2.devtunnels.ms . EventSource can't send custom
    // headers, so stream the SSE response with fetch() and add the headers that
    // tell Dev Tunnels / ngrok to skip their browser warning pages.
    async function connectRemote(base) {
      const url = `${base.replace(/\/+$/, '')}/events`;
      for (;;) {
        try {
          const res = await fetch(url, {
            cache: 'no-store',
            headers: {
              Accept: 'text/event-stream',
              'X-Tunnel-Skip-AntiPhishing-Page': 'True',
              'ngrok-skip-browser-warning': '1',
              'bypass-tunnel-reminder': '1',
            },
          });
          if (!res.ok || !(res.headers.get('content-type') || '').includes('text/event-stream')) {
            throw new Error(`Unexpected response (${res.status})`);
          }
          connected = true;
          render();
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split(/\r?\n\r?\n/);
            buffer = events.pop();
            for (const block of events) {
              let type = 'message';
              const data = [];
              for (const line of block.split(/\r?\n/)) {
                if (line.startsWith('event:')) type = line.slice(6).trim();
                else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
              }
              if (type === 'state' && data.length) onState(data.join('\n'));
            }
          }
        } catch (err) {
          console.warn('Stream error:', err);
        }
        connected = false;
        render();
        await new Promise((r) => setTimeout(r, 3000));
      }
    }

    // If this page is hosted on a static site (Netlify Drop, GitHub Pages, etc.) or opened
    // as a local file, automatically connect to your permanent Dev Tunnel in the background
    // with the skip-warning header so friends never see any interstitial page.
    const DEFAULT_TUNNEL_URL = 'https://0wlgwzvr-8787.usw2.devtunnels.ms';
    const isServedByRelay =
      location.port === '8787' ||
      /\.devtunnels\.ms$|\.lhr\.life$|\.loca\.lt$|\.ngrok/i.test(location.hostname);
    const remoteServer =
      new URLSearchParams(location.search).get('server') ||
      (!isServedByRelay ? DEFAULT_TUNNEL_URL : null);
    const apiBase = remoteServer ? remoteServer.replace(/\/+$/, '') : '';
    let reqCooldown = false;

    try {
      $('viewer-name').value = localStorage.getItem('np_viewer_name') || '';
      $('viewer-name').addEventListener('input', (e) => {
        try { localStorage.setItem('np_viewer_name', e.target.value.trim()); } catch {}
      });
    } catch {}

    async function sendViewerAction(endpoint, extra = {}) {
      const by = ($('viewer-name').value || '').trim();
      await fetch(`${apiBase}${endpoint}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Tunnel-Skip-AntiPhishing-Page': 'True',
          'ngrok-skip-browser-warning': '1',
          'bypass-tunnel-reminder': '1',
        },
        body: JSON.stringify({ by, ...extra }),
      });
    }

    async function performSeek(targetSeconds) {
      if (!canSeek()) return;
      const clamped = Math.max(0, Math.min(state.duration, targetSeconds));
      // Optimistically update local playhead so UI stays where the user seeked
      state.currentTime = clamped;
      state.updatedAt = Date.now() + clockOffset;
      render();
      try {
        await sendViewerAction('/api/seek', { to: clamped });
      } catch (err) {
        console.warn('Seek failed:', err);
      }
    }

    // Interactive Seek Bar (mouse + touch via Pointer Events)
    const barWrap = $('bar-wrap');
    const barEl = $('bar');
    const tooltip = $('seek-tooltip');

    function ratioFromEvent(e) {
      const rect = barEl.getBoundingClientRect();
      if (!rect.width) return 0;
      return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    }

    function updateTooltip(ratio) {
      if (!canSeek()) return;
      const pct = ratio * 100;
      tooltip.style.left = `${pct.toFixed(2)}%`;
      tooltip.textContent = fmt(ratio * state.duration);
    }

    barWrap.addEventListener('pointermove', (e) => {
      if (!canSeek()) return;
      const ratio = ratioFromEvent(e);
      updateTooltip(ratio);
      if (isScrubbing) {
        scrubTime = ratio * state.duration;
        render();
      }
    });

    barWrap.addEventListener('pointerdown', (e) => {
      if (!canSeek() || (e.button != null && e.button !== 0)) return;
      e.preventDefault();
      isScrubbing = true;
      card.classList.add('scrubbing');
      try { barWrap.setPointerCapture(e.pointerId); } catch {}
      const ratio = ratioFromEvent(e);
      scrubTime = ratio * state.duration;
      updateTooltip(ratio);
      render();
    });

    function finishScrub(e) {
      if (!isScrubbing) return;
      const ratio = ratioFromEvent(e);
      const target = ratio * (state && state.duration ? state.duration : 0);
      isScrubbing = false;
      card.classList.remove('scrubbing');
      try { barWrap.releasePointerCapture(e.pointerId); } catch {}
      performSeek(target);
    }

    barWrap.addEventListener('pointerup', finishScrub);
    barWrap.addEventListener('pointercancel', () => {
      if (!isScrubbing) return;
      isScrubbing = false;
      card.classList.remove('scrubbing');
      render();
    });

    // Jump to specific time form
    $('seek-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!canSeek()) return;
      const input = $('seek-input');
      const target = parseTimeInput(input.value);
      if (target == null || target > state.duration) {
        input.style.borderColor = '#e5484d';
        setTimeout(() => { input.style.borderColor = ''; }, 1200);
        return;
      }
      input.value = '';
      input.blur();
      await performSeek(target);
    });

    $('request-pause-btn').addEventListener('click', async () => {
      const btn = $('request-pause-btn');
      reqCooldown = true;
      btn.disabled = true;
      btn.textContent = '✋ Request Sent!';
      try {
        await sendViewerAction('/api/request-pause');
      } catch (err) {
        console.warn('Pause request failed:', err);
      }
      setTimeout(() => {
        reqCooldown = false;
        render();
      }, 2500);
    });

    $('pause-btn').addEventListener('click', async () => {
      const btn = $('pause-btn');
      btn.disabled = true;
      btn.textContent = 'Pausing…';
      try {
        await sendViewerAction('/api/pause');
      } catch (err) {
        console.warn('Pause failed:', err);
        render();
      }
    });

    $('resume-btn').addEventListener('click', async () => {
      const btn = $('resume-btn');
      btn.disabled = true;
      btn.textContent = 'Resuming…';
      try {
        await sendViewerAction('/api/resume');
      } catch (err) {
        console.warn('Resume failed:', err);
        render();
      }
    });

    if (remoteServer) connectRemote(remoteServer);
    else connectSameOrigin();
    setInterval(render, 250);
  </script>
</body>
</html>
