<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now Playing</title>
  <style>
    :root {
      --bg: #0e1015;
      --card: #171a22;
      --text: #eef1f7;
      --muted: #8a93a6;
      --accent: #52b54b; /* Emby green */
      --paused: #f0b429;
      --off: #5b6375;
      --track: #2a2f3c;
    }
    html.day {
      --bg: #f0f4f9;
      --card: #ffffff;
      --text: #161b26;
      --muted: #5a6478;
      --accent: #2e9e28;
      --paused: #d99000;
      --off: #8c96ab;
      --track: #dce2ee;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: background .2s ease, color .2s ease;
    }
    html.day body {
      background: radial-gradient(1200px 600px at 50% -10%, #dfe8f5 0%, var(--bg) 60%);
    }
    .card {
      width: min(560px, 100%);
      height: min(840px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
      border: 1px solid #232838;
      border-radius: 18px;
      padding: 20px 24px 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    html.day .card {
      border-color: #d8e0ed;
      box-shadow: 0 14px 40px rgba(18, 28, 45, .09);
    }
    .header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .header-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #2b3142;
      background: #20242f;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: .03em;
      text-transform: none;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .theme-btn:hover {
      background: #2a3040;
    }
    html.day .theme-btn {
      background: #edf1f7;
      border-color: #d0d9e8;
      color: #2c3547;
    }
    html.day .theme-btn:hover {
      background: #e1e8f3;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #20242f;
      font-weight: 600;
      font-size: 12px;
    }
    html.day .badge {
      background: #edf1f7;
      color: #364052;
      border: 1px solid #dce3ef;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
    .playing .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(82, 181, 75, .7); animation: pulse 1.6s infinite; }
    .paused .dot { background: var(--paused); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(82, 181, 75, .6); }
      70% { box-shadow: 0 0 0 8px rgba(82, 181, 75, 0); }
      100% { box-shadow: 0 0 0 0 rgba(82, 181, 75, 0); }
    }
    .main { display: flex; align-items: center; gap: 14px; }
    .main.thumb-expanded {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .main-top-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .icon {
      flex: none;
      width: 52px; height: 52px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: #222737;
      color: var(--off);
    }
    html.day .icon {
      background: #eef2f8;
    }
    .playing .icon { color: var(--accent); }
    .paused .icon { color: var(--paused); }
    .icon svg { width: 24px; height: 24px; fill: currentColor; }
    .preview-wrap {
      position: relative;
      flex: none;
      width: 128px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #0b0d12;
      border: 1px solid #282f42;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .38);
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    .preview-wrap:hover {
      border-color: rgba(122, 184, 255, .55);
    }
    html.day .preview-wrap {
      border-color: #cbd4e3;
      box-shadow: 0 4px 14px rgba(18, 28, 45, .12);
    }
    .main.thumb-expanded .preview-wrap {
      width: 100%;
      max-height: 210px;
      border-radius: 12px;
    }
    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .preview-badge {
      position: absolute;
      right: 5px;
      bottom: 5px;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(11, 13, 18, .76);
      color: #eef1f7;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .titles { min-width: 0; flex: 1; }
    .title {
      font-size: 20px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }
    .site { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .progress { margin-top: 18px; }
    .bar-wrap {
      position: relative;
      padding: 8px 0;
      margin: -8px 0;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .idle .bar-wrap, .live .bar-wrap {
      cursor: default;
      pointer-events: none;
    }
    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      transition: height .15s ease;
    }
    .bar-wrap:hover .bar, .scrubbing .bar {
      height: 10px;
    }
    .fill {
      position: absolute; inset: 0 auto 0 0;
      width: 0%;
      background: var(--off);
      border-radius: inherit;
      transition: width .25s linear;
    }
    .scrubbing .fill {
      transition: none !important;
    }
    .playing .fill { background: var(--accent); }
    .paused .fill { background: var(--paused); }
    .thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .6);
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease, left .25s linear;
      pointer-events: none;
    }
    html.day .thumb {
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(18, 28, 45, .3);
    }
    .playing .thumb { border: 2px solid var(--accent); }
    .paused .thumb { border: 2px solid var(--paused); }
    .bar-wrap:hover .thumb, .scrubbing .thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }
    .scrubbing .thumb {
      transition: opacity .15s ease, transform .15s ease !important;
    }
    @media (hover: none) and (pointer: coarse) {
      .playing .thumb, .paused .thumb {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    .seek-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0%;
      transform: translateX(-50%);
      padding: 3px 7px;
      border-radius: 6px;
      background: #0b0d12;
      border: 1px solid #2b3142;
      color: #eef1f7;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s ease;
    }
    .bar-wrap:hover .seek-tooltip, .scrubbing .seek-tooltip {
      opacity: 1;
    }
    .live .bar { overflow: hidden; }
    .live .thumb, .live .seek-tooltip { display: none; }
    .live .fill {
      width: 100% !important;
      background: repeating-linear-gradient(90deg, #e5484d 0 12px, #b8373b 12px 24px);
      background-size: 48px 100%;
      animation: slide 1.2s linear infinite;
    }
    .live.paused .fill { animation: none; }
    @keyframes slide { to { background-position: 48px 0; } }
    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 14px;
    }
    .times .now { color: var(--text); font-weight: 600; }
    .footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .idle .progress { opacity: .35; }
    .hidden { display: none !important; }
    #unlocked-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-controls-pane {
      flex: 0 0 auto;
      max-height: 54%;
      overflow-y: auto;
      padding-right: 2px;
    }
    .bottom-dock {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #232838;
      overflow: hidden;
    }
    html.day .bottom-dock {
      border-top-color: #e1e7f0;
    }
    .history {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .history-list {
      flex: 1 1 auto;
      min-height: 0;
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #13161d;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      animation: fadeIn .25s ease-out;
    }
    html.day .history-item {
      background: #f5f7fb;
      border: 1px solid #e3e8f2;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .history-tag {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #202534;
      font-size: 12px;
    }
    html.day .history-tag { background: #e6ebf5; }
    .history-tag.rewind { background: rgba(94, 168, 255, .15); color: #6eb2ff; }
    .history-tag.forward { background: rgba(168, 130, 255, .15); color: #b99aff; }
    .history-tag.paused { background: rgba(240, 180, 41, .15); color: var(--paused); }
    .history-tag.resumed, .history-tag.started { background: rgba(82, 181, 75, .15); color: var(--accent); }
    html.day .history-tag.rewind { background: rgba(24, 119, 242, .12); color: #1565c0; }
    html.day .history-tag.forward { background: rgba(124, 58, 237, .12); color: #6d28d9; }
    html.day .history-tag.paused { background: rgba(217, 144, 0, .15); color: #b27400; }
    html.day .history-tag.resumed, html.day .history-tag.started { background: rgba(46, 158, 40, .14); color: #23801e; }
    .history-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #d7dce8;
    }
    html.day .history-text {
      color: #2c3547;
    }
    .history-text strong {
      color: var(--text);
      font-weight: 600;
    }
    .history-ago {
      flex: none;
      color: var(--muted);
      font-size: 12px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .seek-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #282e3f;
      background: #11141b;
      color: var(--text);
      font: inherit;
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom on focus */
      outline: none;
      transition: border-color .15s;
    }
    .seek-input:focus {
      border-color: #8f6bff;
    }
    html.day .seek-input {
      background: #ffffff;
      border-color: #cbd4e3;
    }
    html.day .seek-input:focus {
      border-color: #7c3aed;
    }
    .seek-input::placeholder { color: #636b7e; }
    html.day .seek-input::placeholder { color: #8892a6; }
    .seek-row {
      display: flex;
      gap: 8px;
    }
    .seek-input {
      flex: 1;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }
    .seek-btn {
      flex: none;
      padding: 9px 16px;
      border: 1px solid rgba(168, 130, 255, .45);
      background: rgba(168, 130, 255, .16);
      color: #c5abff;
    }
    .seek-btn:hover:not(:disabled) {
      background: rgba(168, 130, 255, .26);
    }
    html.day .seek-btn {
      border-color: rgba(124, 58, 237, .4);
      background: rgba(124, 58, 237, .1);
      color: #6d28d9;
    }
    html.day .seek-btn:hover:not(:disabled) {
      background: rgba(124, 58, 237, .18);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, opacity .15s, transform .08s;
    }
    .action-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .req-btn {
      border: 1px solid rgba(94, 168, 255, .4);
      background: rgba(94, 168, 255, .14);
      color: #7ab8ff;
    }
    .req-btn:hover:not(:disabled) {
      background: rgba(94, 168, 255, .24);
    }
    html.day .req-btn {
      border-color: rgba(24, 119, 242, .4);
      background: rgba(24, 119, 242, .1);
      color: #1565c0;
    }
    html.day .req-btn:hover:not(:disabled) {
      background: rgba(24, 119, 242, .18);
    }
    .pause-btn {
      border: 1px solid rgba(240, 180, 41, .45);
      background: rgba(240, 180, 41, .16);
      color: #f6c453;
    }
    .pause-btn:hover:not(:disabled) {
      background: rgba(240, 180, 41, .26);
    }
    html.day .pause-btn {
      border-color: rgba(217, 144, 0, .45);
      background: rgba(217, 144, 0, .12);
      color: #a86c00;
    }
    html.day .pause-btn:hover:not(:disabled) {
      background: rgba(217, 144, 0, .22);
    }
    .resume-btn {
      border: 1px solid rgba(82, 181, 75, .45);
      background: rgba(82, 181, 75, .16);
      color: #6fd368;
    }
    .resume-btn:hover:not(:disabled) {
      background: rgba(82, 181, 75, .26);
    }
    html.day .resume-btn {
      border-color: rgba(46, 158, 40, .45);
      background: rgba(46, 158, 40, .12);
      color: #1f7a1a;
    }
    html.day .resume-btn:hover:not(:disabled) {
      background: rgba(46, 158, 40, .22);
    }
    .action-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      border-color: #2a2f3c;
      background: #1f232e;
      color: var(--muted);
    }
    html.day .action-btn:disabled {
      border-color: #dce2ee;
      background: #eff2f8;
      color: #8c96ab;
    }
    .more-btn {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 9px 12px;
      font-size: 13px;
      border: 1px solid #2b3142;
      background: #171b24;
      color: var(--muted);
    }
    .more-btn:hover:not(:disabled) {
      background: #1f2533;
      color: var(--text);
    }
    .more-btn.active {
      border-color: rgba(168, 130, 255, .45);
      background: rgba(168, 130, 255, .14);
      color: #c5abff;
    }
    html.day .more-btn {
      border-color: #d6deec;
      background: #f0f4fa;
      color: var(--muted);
    }
    html.day .more-btn:hover:not(:disabled) {
      background: #e4ebf6;
      color: var(--text);
    }
    html.day .more-btn.active {
      border-color: rgba(124, 58, 237, .4);
      background: rgba(124, 58, 237, .1);
      color: #6d28d9;
    }
    .chat {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .code-gate {
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(24, 29, 42, 0.96), rgba(17, 20, 29, 0.98));
      border: 1px solid rgba(122, 184, 255, 0.38);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    html.day .code-gate {
      background: linear-gradient(145deg, #f5f8ff, #eef3fb);
      border-color: rgba(24, 119, 242, 0.35);
    }
    .code-gate-title {
      font-size: 15px;
      font-weight: 650;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .code-gate-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .code-gate-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .code-gate-row {
      display: flex;
      gap: 8px;
    }
    .code-gate-name-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2d364d;
      background: #11141b;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color .15s;
    }
    .code-gate-name-input:focus {
      border-color: #5ea8ff;
    }
    html.day .code-gate-name-input {
      background: #ffffff;
      border-color: #cbd4e3;
    }
    html.day .code-gate-name-input:focus {
      border-color: #1877f2;
    }
    .code-gate-name-input::placeholder {
      color: #636b7e;
    }
    html.day .code-gate-name-input::placeholder {
      color: #8892a6;
    }
    .code-gate-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2d364d;
      background: #11141b;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-align: center;
      outline: none;
      transition: border-color .15s;
    }
    .code-gate-input:focus {
      border-color: #5ea8ff;
    }
    html.day .code-gate-input {
      background: #ffffff;
      border-color: #cbd4e3;
    }
    html.day .code-gate-input:focus {
      border-color: #1877f2;
    }
    .code-gate-input::placeholder {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: normal;
      color: #636b7e;
    }
    html.day .code-gate-input::placeholder {
      color: #8892a6;
    }
    .code-gate-btn {
      flex: none;
      padding: 10px 18px;
      border: 1px solid rgba(94, 168, 255, 0.5);
      background: rgba(94, 168, 255, 0.2);
      color: #9ecaff;
    }
    .code-gate-btn:hover:not(:disabled) {
      background: rgba(94, 168, 255, 0.32);
    }
    html.day .code-gate-btn {
      border-color: rgba(24, 119, 242, 0.45);
      background: rgba(24, 119, 242, 0.12);
      color: #1565c0;
    }
    html.day .code-gate-btn:hover:not(:disabled) {
      background: rgba(24, 119, 242, 0.22);
    }
    .code-gate-err {
      color: #ff7b7f;
      font-size: 12.5px;
      font-weight: 500;
    }
    html.day .code-gate-err {
      color: #d92d20;
    }
    .chat-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px;
      border-radius: 12px;
      background: #11141b;
      border: 1px solid #222736;
    }
    html.day .chat-list {
      background: #f5f7fb;
      border-color: #dfe5f0;
    }
    .chat-empty {
      color: #636b7e;
      font-size: 13px;
      text-align: center;
      padding: 16px 8px;
    }

<body>
  <main id="card" class="card idle" aria-live="polite">
    <div class="header">
      <span id="heading">Now Playing</span>
      <div class="header-right">
        <button id="theme-btn" class="theme-btn" type="button" title="Switch between Day and Night theme">☀️ Day</button>

    <div id="code-gate" class="code-gate hidden">

      <form id="code-gate-form" class="code-gate-form" autocomplete="off">

              <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
              <svg id="icon-idle" viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18z"/></svg>

  <script>
    'use strict';

    // How long without an update before we assume the broadcaster went away.
    // Paused background tabs can be heavily throttled by Chrome, so allow longer.
    const STALE_PLAYING_MS = 30_000;
    const STALE_PAUSED_MS = 150_000;

    const $ = (id) => document.getElementById(id);
    const card = $('card');

    function applyTheme(theme) {
      const isDay = theme === 'day';
      document.documentElement.classList.toggle('day', isDay);
      const btn = $('theme-btn');
      if (btn) {
        btn.textContent = isDay ? '🌙 Night' : '☀️ Day';
        btn.title = isDay ? 'Switch to Night theme' : 'Switch to Day (brighter) theme';
      }
      try { localStorage.setItem('np_theme', isDay ? 'day' : 'night'); } catch {}
    }

    try {
      const savedTheme = localStorage.getItem('np_theme');
      if (savedTheme === 'day') applyTheme('day');
    } catch {}

    $('theme-btn').addEventListener('click', () => {
      const isDay = document.documentElement.classList.contains('day');
      applyTheme(isDay ? 'night' : 'day');
    });

    let state = null;
    let history = [];
    let messages = [];
    let name = '';
    let clockOffset = 0; // serverNow - Date.now()
    let connected = false;
    let isScrubbing = false;
    let scrubTime = 0;
    let viewerId = '';
    try {
      viewerId = localStorage.getItem('np_viewer_id') || '';
      if (!viewerId) {
        viewerId = 'v_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        localStorage.setItem('np_viewer_id', viewerId);
      }
    } catch {
      viewerId = 'v_' + Math.random().toString(36).slice(2, 10);
    }

    $('more-btn').addEventListener('click', () => {
      const form = $('seek-form');
      const open = form.classList.toggle('hidden') === false;
      $('more-btn').classList.toggle('active', open);
      if (open && !$('seek-input').disabled) {
        setTimeout(() => $('seek-input').focus(), 20);
      }
    });

    function fmt(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '–:––';
      const s = Math.floor(totalSeconds);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    }

    function parseTimeInput(raw) {
      const s = (raw || '').trim().toLowerCase();
      if (!s) return null;
      // Colon format: mm:ss or hh:mm:ss
      if (s.includes(':')) {
        const parts = s.split(':').map((p) => Number(p.trim()));
        if (parts.some((n) => !Number.isFinite(n) || n < 0)) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }
      // Unit format: e.g. 1h20m, 12m30s, 45s
      const unitMatch = s.match(/^(?:(\d+(?:\.\d+)?)h)?\s*(?:(\d+(?:\.\d+)?)m)?\s*(?:(\d+(?:\.\d+)?)s)?$/);
      if (unitMatch && (unitMatch[1] || unitMatch[2] || unitMatch[3])) {
        const h = Number(unitMatch[1] || 0);
        const m = Number(unitMatch[2] || 0);
        const sec = Number(unitMatch[3] || 0);
        return h * 3600 + m * 60 + sec;
      }
      // Plain seconds: e.g. "90"
      const numVal = Number(s);
      return Number.isFinite(numVal) && numVal >= 0 ? numVal : null;
    }

    function fmtDelta(seconds) {
      const s = Math.round(Math.abs(seconds));
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      const rem = s % 60;
      if (m < 60) return rem ? `${m}m ${rem}s` : `${m}m`;
      const h = Math.floor(m / 60);
      const remM = m % 60;
      return remM ? `${h}h ${remM}m` : `${h}h`;
    }

    function ago(ms) {
      const s = Math.round(Math.max(0, ms) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m} min ago`;
      return `${Math.round(m / 60)} h ago`;
    }

    function describeAction(item) {
      switch (item.type) {
        case 'rewind':
          return {
            icon: '⏪',
            cls: 'rewind',
            label: `Rewound ${fmtDelta(item.delta || (item.to - item.from))} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'forward':
          return {
            icon: '⏩',
            cls: 'forward',
            label: `Fast-forwarded ${fmtDelta(item.delta || (item.to - item.from))} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'paused':
          return {
            icon: '⏸',
            cls: 'paused',
            label: `Paused at ${fmt(item.at)}`,
          };
        case 'pause-requested':
          return {
            icon: '✋',
            cls: 'rewind',
            label: `${item.by || 'A viewer'} requested a pause at ${fmt(item.at)}`,
          };
        case 'viewer-paused':
          return {
            icon: '⏸',
            cls: 'paused',
            label: `${item.by || 'A viewer'} paused the video at ${fmt(item.at)}`,
          };
        case 'viewer-resumed':
          return {
            icon: '▶',
            cls: 'resumed',
            label: `${item.by || 'A viewer'} resumed the video at ${fmt(item.at)}`,
          };
        case 'viewer-seeked':
          return {
            icon: '🎯',
            cls: 'forward',
            label: `${item.by || 'A viewer'} jumped to ${fmt(item.to)} (${fmt(item.from)} → ${fmt(item.to)})`,
          };
        case 'resumed':
          return {
            icon: '▶',
            cls: 'resumed',
            label: `Resumed at ${fmt(item.at)}`,
          };
        case 'started':
          return {
            icon: '▶',
            cls: 'started',
            label: item.title ? `Started watching "${item.title}"` : `Started watching at ${fmt(item.at)}`,
          };
        case 'switched':
          return {
            icon: '⏭',
            cls: 'started',
            label: item.title ? `Switched to "${item.title}"` : 'Switched video',
          };
        case 'rate':
          return {
            icon: '⚡',
            cls: 'forward',
            label: `Changed speed to ${item.rate}× at ${fmt(item.at)}`,
          };
        case 'ended':
          return {
            icon: '🏁',
            cls: 'paused',
            label: `Finished watching (${fmt(item.at)})`,
          };
        case 'stopped':
          return {
            icon: '◼',
            cls: 'paused',
            label: 'Closed player',
          };
        default:
          return { icon: '•', cls: '', label: item.type };
      }
    }

    const QUICK_EMOJIS = ['😂', '❤️', '🔥', '😮', '👏', '😭'];
    let openPickerMsgId = null;

    function syncOpenReactionPicker() {
      const list = $('chat-list');
      if (!list) return;
      for (const el of list.querySelectorAll('.chat-msg')) {
        const id = Number(el.dataset.msgId);
        el.classList.toggle('picker-open', openPickerMsgId != null && id === openPickerMsgId);
      }
    }

    async function toggleViewerReaction(messageId, emoji) {
      openPickerMsgId = null;
      syncOpenReactionPicker();
      try {
        await sendViewerAction('/api/chat/react', { messageId, emoji, role: 'viewer' });
      } catch (err) {
        console.warn('Reaction failed:', err);
      }
    }

    function renderChat() {
      const list = $('chat-list');
      const timeline = [];
      if (Array.isArray(history)) {
        for (const h of history) {
          timeline.push({ kind: 'activity', ts: h.timestamp || 0, data: h });
        }
      }
      if (Array.isArray(messages)) {
        for (const m of messages) {
          timeline.push({ kind: 'msg', ts: m.timestamp || 0, data: m });
        }
      }
      timeline.sort((a, b) => a.ts - b.ts);

      if (timeline.length === 0) {
        if (list.dataset.sig !== 'empty') {
          list.dataset.sig = 'empty';
          list.innerHTML = '<div class="chat-empty">No messages yet — say hi!</div>';
        }
        return;
      }

      const myName = getStoredName() || 'Viewer';
      const sig = timeline
        .map((entry) =>
          entry.kind === 'activity'
            ? `a:${entry.data.id}:${entry.ts}:${entry.data.to ?? ''}`
            : `m:${entry.data.id}:${entry.data.by || ''}:${entry.data.text || ''}:${JSON.stringify(entry.data.reactions || {})}`
        )
        .join('|') + `|me=${myName}|vid=${viewerId}|open=${openPickerMsgId ?? ''}`;
      if (list.dataset.sig === sig) return;
      const prevCount = Number(list.dataset.count || 0);
      const isNewMsg = timeline.length > prevCount;
      const wasNearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
      const prevScrollTop = list.scrollTop;
      list.dataset.sig = sig;
      list.dataset.count = String(timeline.length);

      const frag = document.createDocumentFragment();
      for (const entry of timeline) {
        if (entry.kind === 'activity') {
          const info = describeAction(entry.data);
          const sys = document.createElement('div');
          sys.className = 'chat-msg-system';
          const clock = entry.ts
            ? new Date(entry.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            : '';
          sys.textContent = `${info.icon} ${info.label}${clock ? ` · ${clock}` : ''}`;
          frag.appendChild(sys);
          continue;
        }

        const m = entry.data;
        if (m.role === 'system' || m.type === 'join') {
          const sys = document.createElement('div');
          sys.className = 'chat-msg-system';
          const clock = m.timestamp
            ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            : '';
          sys.textContent = `👋 ${m.text || `${m.by || 'Viewer'} has entered the chat`}${clock ? ` · ${clock}` : ''}`;
          frag.appendChild(sys);
          continue;
        }

        const item = document.createElement('div');
        const isHost = m.role === 'host';
        const isMine = !isHost && ((m.senderId && m.senderId === viewerId) || (!m.senderId && myName !== 'Viewer' && m.by === myName));
        const isPickerOpen = openPickerMsgId === m.id;
        item.className = `chat-msg ${isHost ? 'host other' : isMine ? 'viewer mine' : 'viewer other'}${isPickerOpen ? ' picker-open' : ''}`;
        item.dataset.msgId = String(m.id);

        const meta = document.createElement('div');
        meta.className = 'chat-meta';

        const author = document.createElement('span');
        author.className = 'chat-author';
        author.textContent = isHost ? `👑 ${m.by || name || 'Host'}` : isMine ? (m.by || myName) : (m.by || 'Viewer');

        const time = document.createElement('span');
        time.className = 'chat-time';
        const clock = m.timestamp
          ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : '';
        time.textContent = m.videoTime != null ? `@ ${fmt(m.videoTime)} · ${clock}` : clock;

        meta.append(author, time);

        const body = document.createElement('div');
        body.className = 'chat-text';
        body.textContent = m.text || '';

        const footer = document.createElement('div');
        footer.className = 'chat-msg-footer';

        const reactions = m.reactions && typeof m.reactions === 'object' ? m.reactions : {};
        for (const [em, users] of Object.entries(reactions)) {
          if (!Array.isArray(users) || users.length === 0) continue;
          const pill = document.createElement('button');
          pill.type = 'button';
          const iReacted = users.includes(myName);
          pill.className = `chat-react-pill${iReacted ? ' active' : ''}`;
          pill.textContent = `${em} ${users.length}`;
          pill.title = `Reacted by: ${users.join(', ')}`;
          pill.addEventListener('click', () => toggleViewerReaction(m.id, em));
          footer.appendChild(pill);
        }

        const picker = document.createElement('div');
        picker.className = 'chat-react-picker';
        for (const em of QUICK_EMOJIS) {
          const rb = document.createElement('button');
          rb.type = 'button';
          rb.className = 'chat-react-btn';
          rb.textContent = em;
          rb.title = `React with ${em}`;
          rb.addEventListener('click', () => toggleViewerReaction(m.id, em));
          picker.appendChild(rb);
        }
        footer.appendChild(picker);

        item.append(meta, body, footer);
        frag.appendChild(item);
      }
      list.replaceChildren(frag);
      if (isNewMsg || wasNearBottom) {
        list.scrollTop = list.scrollHeight;
      } else {
        list.scrollTop = prevScrollTop;
      }
    }

    // Long-press on mobile to open reaction emoji picker on a chat message
    let longPressTimer = null;
    let touchStartX = 0;
    let touchStartY = 0;

    $('chat-list').addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) return;
      const msgEl = e.target.closest('.chat-msg[data-msg-id]');
      if (!msgEl) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      const msgId = Number(msgEl.dataset.msgId);
      if (longPressTimer) clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        openPickerMsgId = openPickerMsgId === msgId ? null : msgId;
        syncOpenReactionPicker();
        try { if (navigator.vibrate) navigator.vibrate(15); } catch {}
      }, 420);
    }, { passive: true });

    $('chat-list').addEventListener('touchmove', (e) => {
      if (!longPressTimer) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      if (Math.hypot(t.clientX - touchStartX, t.clientY - touchStartY) > 10) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }, { passive: true });

    const cancelLongPress = () => {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    };
    $('chat-list').addEventListener('touchend', cancelLongPress, { passive: true });
    $('chat-list').addEventListener('touchcancel', cancelLongPress, { passive: true });
    $('chat-list').addEventListener('contextmenu', (e) => {
      if (e.target.closest('.chat-msg[data-msg-id]') && window.matchMedia('(hover: none), (pointer: coarse)').matches) {
        e.preventDefault();
      }
    });

    document.addEventListener('pointerdown', (e) => {
      if (openPickerMsgId == null) return;
      const inOpenMsg = e.target.closest(`.chat-msg[data-msg-id="${openPickerMsgId}"]`);
      if (!inOpenMsg) {
        openPickerMsgId = null;
        syncOpenReactionPicker();
      }
    });

    function setMode(mode) {
      card.classList.toggle('playing', mode === 'playing');
      card.classList.toggle('paused', mode === 'paused');
      card.classList.toggle('idle', mode === 'idle');
      $('icon-play').classList.toggle('hidden', mode !== 'playing');
      $('icon-pause').classList.toggle('hidden', mode !== 'paused');
      $('icon-idle').classList.toggle('hidden', mode !== 'idle');
    }

    function canSeek() {
      if (!codeVerified) return false;
      if (!state || !state.active || state.duration == null || state.duration <= 0) return false;
      const now = Date.now() + clockOffset;
      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      return !stale;
    }

    let codeVerified = false;
    let serverSessionId = '';
    let verifiedSessionId = '';
    let verifyingCode = false;

    function updateLockUI() {
      const locked = connected && !codeVerified;
      $('code-gate').classList.toggle('hidden', !locked);
      $('unlocked-body').classList.toggle('hidden', locked);
    }

    let thumbExpanded = false;
    try {
      thumbExpanded = localStorage.getItem('np_thumb_expanded') === '1';
    } catch {}
    function syncThumbExpandedUI() {
      $('main-box').classList.toggle('thumb-expanded', thumbExpanded);
      $('preview-badge').textContent = thumbExpanded ? '🗕' : '⛶';
    }
    syncThumbExpandedUI();
    $('preview-wrap').addEventListener('click', () => {
      thumbExpanded = !thumbExpanded;
      try { localStorage.setItem('np_thumb_expanded', thumbExpanded ? '1' : '0'); } catch {}
      syncThumbExpandedUI();
    });

    function render() {
      const now = Date.now() + clockOffset;
      $('heading').textContent = name ? `${name} is watching` : 'Now Playing';
      $('conn').textContent = connected ? '' : 'Reconnecting to server…';
      updateLockUI();

      if (connected && !codeVerified) {
        setMode('idle');
        $('status').textContent = 'Locked';
        document.title = '🔐 Security Code Required';
        return;
      }

      renderChat();

      if (!state || !state.active) {
        setMode('idle');
        card.classList.remove('live', 'scrubbing');
        isScrubbing = false;
        $('preview-wrap').classList.add('hidden');
        $('status').textContent = connected ? 'Offline' : 'Connecting…';
        $('title').textContent = 'Nothing playing right now';
        $('site').textContent = '';
        $('fill').style.width = '0%';
        $('thumb').style.left = '0%';
        $('current').textContent = '–:––';
        $('duration').textContent = '–:––';
        $('updated').textContent = state ? `Last activity ${ago(now - state.updatedAt)}` : '';
        $('request-pause-btn').disabled = true;
        $('request-pause-btn').textContent = '✋ Request Pause';
        $('pause-btn').disabled = true;
        $('pause-btn').className = 'action-btn pause-btn';
        $('pause-btn').textContent = '⏸ Pause';
        $('seek-input').disabled = true;
        $('seek-btn').disabled = true;
        document.title = 'Now Playing';
        return;
      }

      const age = Math.max(0, now - state.updatedAt);
      const stale = age > (state.paused ? STALE_PAUSED_MS : STALE_PLAYING_MS);
      const isLive = state.duration == null;

      // Interpolate the playhead between updates so the clock ticks smoothly.
      let t = state.currentTime;
      if (!state.paused && !stale) t += (age / 1000) * state.playbackRate;
      if (!isLive) t = Math.min(t, state.duration);
      const displayTime = isScrubbing ? scrubTime : t;

      const mode = stale ? 'idle' : state.paused ? 'paused' : 'playing';
      setMode(mode);
      card.classList.toggle('live', isLive && !stale);

      if (state.thumbnail && !stale) {
        $('preview-wrap').classList.remove('hidden');
        if ($('preview-img').getAttribute('src') !== state.thumbnail) {
          $('preview-img').setAttribute('src', state.thumbnail);
        }
      } else {
        $('preview-wrap').classList.add('hidden');
      }

      if (!reqCooldown) {
        $('request-pause-btn').disabled = mode !== 'playing';
        $('request-pause-btn').textContent = '✋ Request Pause';
      }
      const isPaused = mode === 'paused';
      $('pause-btn').disabled = mode === 'idle';
      $('pause-btn').className = `action-btn ${isPaused ? 'resume-btn' : 'pause-btn'}`;
      $('pause-btn').textContent = isPaused ? '▶ Resume' : '⏸ Pause';

      const seekable = !stale && !isLive;
      $('seek-input').disabled = !seekable;
      $('seek-btn').disabled = !seekable;

      $('status').textContent = stale ? 'Signal lost' : state.paused ? 'Paused' : isLive ? 'Live' : 'Playing';
      $('title').textContent = state.title || 'Something private 🤫';
      $('site').textContent = state.site || '';
      $('current').textContent = fmt(displayTime);
      $('duration').textContent = isLive ? 'LIVE' : fmt(state.duration);
      const pct = isLive ? 100 : Math.min(100, Math.max(0, (displayTime / state.duration) * 100));
      $('fill').style.width = `${pct.toFixed(2)}%`;
      $('thumb').style.left = `${pct.toFixed(2)}%`;
      $('bar-wrap').setAttribute('aria-valuenow', String(Math.round(pct)));
      $('updated').textContent = `Updated ${ago(age)}` +
        (state.playbackRate && state.playbackRate !== 1 ? ` · ${state.playbackRate}×` : '');

      const glyph = mode === 'playing' ? '▶' : mode === 'paused' ? '⏸' : '◼';
      document.title = `${glyph} ${state.title || 'Now Playing'}`;
    }

    function onState(json) {
      const data = JSON.parse(json);
      clockOffset = data.serverNow - Date.now();
      state = data.state;
      history = Array.isArray(data.history) ? data.history : [];
      messages = Array.isArray(data.messages) ? data.messages : [];
      name = data.name || '';
      connected = true;
      if (data.codeSessionId && data.codeSessionId !== serverSessionId) {
        serverSessionId = data.codeSessionId;
        if (verifiedSessionId !== serverSessionId) {
          verifySecurityCode(getStoredCode(), false);
        }
      } else if (!data.codeSessionId && !codeVerified) {
        verifySecurityCode(getStoredCode(), false);
      }
      render();
    }

    // Same-origin mode: page is served by the relay itself.
    function connectSameOrigin() {
      const es = new EventSource('events');
      es.addEventListener('open', () => { connected = true; render(); });
      es.addEventListener('error', () => { connected = false; render(); }); // EventSource auto-reconnects
      es.addEventListener('state', (e) => onState(e.data));
    }

    // Remote mode: page is hosted elsewhere (e.g. GitHub Pages) and opened with
    // ?server=https://xxxx-8787.usw2.devtunnels.ms . EventSource can't send custom
    // headers, so stream the SSE response with fetch() and add the headers that
    // tell Dev Tunnels / ngrok to skip their browser warning pages.
    async function connectRemote(base) {
      const url = `${base.replace(/\/+$/, '')}/events`;
      for (;;) {
        try {
          const res = await fetch(url, {
            cache: 'no-store',
            headers: {
              Accept: 'text/event-stream',
              'X-Tunnel-Skip-AntiPhishing-Page': 'True',
              'ngrok-skip-browser-warning': '1',
              'bypass-tunnel-reminder': '1',
            },
          });
          if (!res.ok || !(res.headers.get('content-type') || '').includes('text/event-stream')) {
            throw new Error(`Unexpected response (${res.status})`);
          }
          connected = true;
          render();
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split(/\r?\n\r?\n/);
            buffer = events.pop();
            for (const block of events) {
              let type = 'message';
              const data = [];
              for (const line of block.split(/\r?\n/)) {
                if (line.startsWith('event:')) type = line.slice(6).trim();
                else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
              }
              if (type === 'state' && data.length) onState(data.join('\n'));
            }
          }
        } catch (err) {
          console.warn('Stream error:', err);
        }
        connected = false;
        render();
        await new Promise((r) => setTimeout(r, 3000));
      }
    }

    // If this page is hosted on a static site (Netlify Drop, GitHub Pages, etc.) or opened
    // as a local file, automatically connect to your permanent Dev Tunnel in the background
    // with the skip-warning header so friends never see any interstitial page.
    const DEFAULT_TUNNEL_URL = 'https://0wlgwzvr-8787.usw2.devtunnels.ms';
    const isServedByRelay =
      location.port === '8787' ||
      /\.devtunnels\.ms$|\.lhr\.life$|\.loca\.lt$|\.ngrok/i.test(location.hostname);
    const remoteServer =
      new URLSearchParams(location.search).get('server') ||
      (!isServedByRelay ? DEFAULT_TUNNEL_URL : null);
    const apiBase = remoteServer ? remoteServer.replace(/\/+$/, '') : '';
    let reqCooldown = false;

    function getStoredName() {
      try {
        return (($('code-gate-name') && $('code-gate-name').value) || localStorage.getItem('np_viewer_name') || '').trim();
      } catch {
        return (($('code-gate-name') && $('code-gate-name').value) || '').trim();
      }
    }

    function getStoredCode() {
      try {
        return (($('code-gate-input') && $('code-gate-input').value) || localStorage.getItem('np_security_code') || '').trim();
      } catch {
        return (($('code-gate-input') && $('code-gate-input').value) || '').trim();
      }
    }

    function setStoredCode(code) {
      const cleaned = String(code || '').trim();
      if ($('code-gate-input')) $('code-gate-input').value = cleaned;
      try {
        localStorage.setItem('np_security_code', cleaned);
      } catch {}
    }

    async function verifySecurityCode(codeToTry, showErrOnFail = true) {
      const cleaned = String(codeToTry || '').trim();
      if (!cleaned) {
        codeVerified = false;
        verifiedSessionId = '';
        if (showErrOnFail) $('code-gate-err').classList.remove('hidden');
        render();
        return false;
      }
      if (verifyingCode) return false;
      verifyingCode = true;
      try {
        const by = getStoredName();
        const res = await fetch(`${apiBase}/api/verify-code`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Security-Code': cleaned,
            'X-Tunnel-Skip-AntiPhishing-Page': 'True',
            'ngrok-skip-browser-warning': '1',
            'bypass-tunnel-reminder': '1',
          },
          body: JSON.stringify({ code: cleaned, senderId: viewerId, by }),
        });
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          setStoredCode(cleaned);
          codeVerified = true;
          verifiedSessionId = data.codeSessionId || serverSessionId || 'ok';
          $('code-gate-err').classList.add('hidden');
          render();
          return true;
        }
        codeVerified = false;
        verifiedSessionId = '';
        if (showErrOnFail) {
          $('code-gate-err').classList.remove('hidden');
        }
        render();
        return false;
      } catch (err) {
        console.warn('Code verification error:', err);
        return false;
      } finally {
        verifyingCode = false;
      }
    }

    try {
      const savedName = localStorage.getItem('np_viewer_name') || '';
      if ($('code-gate-name')) {
        $('code-gate-name').value = savedName;
        $('code-gate-name').addEventListener('input', (e) => {
          try { localStorage.setItem('np_viewer_name', e.target.value.trim()); } catch {}
          renderChat();
        });
      }
      const initialCode = localStorage.getItem('np_security_code') || '';
      if ($('code-gate-input')) $('code-gate-input').value = initialCode;
    } catch {}

    $('code-gate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if ($('code-gate-name')) {
        try { localStorage.setItem('np_viewer_name', $('code-gate-name').value.trim()); } catch {}
      }
      const val = ($('code-gate-input').value || '').trim();
      const ok = await verifySecurityCode(val, true);
      if (!ok) {
        $('code-gate-input').focus();
        $('code-gate-input').select();
      }
    });

    async function sendViewerAction(endpoint, extra = {}) {
      const by = getStoredName();
      const code = getStoredCode();
      const res = await fetch(`${apiBase}${endpoint}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Security-Code': code,
          'X-Tunnel-Skip-AntiPhishing-Page': 'True',
          'ngrok-skip-browser-warning': '1',
          'bypass-tunnel-reminder': '1',
        },
        body: JSON.stringify({ by, senderId: viewerId, code, ...extra }),
      });
      if (res.status === 401) {
        codeVerified = false;
        verifiedSessionId = '';
        $('code-gate-err').classList.remove('hidden');
        render();
        setTimeout(() => $('code-gate-input').focus(), 50);
        throw new Error('Invalid security code');
      }
      return res;
    }

    async function performSeek(targetSeconds) {
      if (!canSeek()) return;
      const clamped = Math.max(0, Math.min(state.duration, targetSeconds));
      // Optimistically update local playhead so UI stays where the user seeked
      state.currentTime = clamped;
      state.updatedAt = Date.now() + clockOffset;
      render();
      try {
        await sendViewerAction('/api/seek', { to: clamped });
      } catch (err) {
        console.warn('Seek failed:', err);
      }
    }

    // Interactive Seek Bar (mouse + touch via Pointer Events)
    const barWrap = $('bar-wrap');
    const barEl = $('bar');
    const tooltip = $('seek-tooltip');

    function ratioFromEvent(e) {
      const rect = barEl.getBoundingClientRect();
      if (!rect.width) return 0;
      return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    }

    function updateTooltip(ratio) {
      if (!canSeek()) return;
      const pct = ratio * 100;
      tooltip.style.left = `${pct.toFixed(2)}%`;
      tooltip.textContent = fmt(ratio * state.duration);
    }

    barWrap.addEventListener('pointermove', (e) => {
      if (!canSeek()) return;
      const ratio = ratioFromEvent(e);
      updateTooltip(ratio);
      if (isScrubbing) {
        scrubTime = ratio * state.duration;
        render();
      }
    });

    barWrap.addEventListener('pointerdown', (e) => {
      if (!canSeek() || (e.button != null && e.button !== 0)) return;
      e.preventDefault();
      isScrubbing = true;
      card.classList.add('scrubbing');
      try { barWrap.setPointerCapture(e.pointerId); } catch {}
      const ratio = ratioFromEvent(e);
      scrubTime = ratio * state.duration;
      updateTooltip(ratio);
      render();
    });

    function finishScrub(e) {
      if (!isScrubbing) return;
      const ratio = ratioFromEvent(e);
      const target = ratio * (state && state.duration ? state.duration : 0);
      isScrubbing = false;
      card.classList.remove('scrubbing');
      try { barWrap.releasePointerCapture(e.pointerId); } catch {}
      performSeek(target);
    }

    barWrap.addEventListener('pointerup', finishScrub);
    barWrap.addEventListener('pointercancel', () => {
      if (!isScrubbing) return;
      isScrubbing = false;
      card.classList.remove('scrubbing');
      render();
    });

    // Jump to specific time form
    $('seek-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!canSeek()) return;
      const input = $('seek-input');
      const target = parseTimeInput(input.value);
      if (target == null || target > state.duration) {
        input.style.borderColor = '#e5484d';
        setTimeout(() => { input.style.borderColor = ''; }, 1200);
        return;
      }
      input.value = '';
      input.blur();
      await performSeek(target);
    });

    $('request-pause-btn').addEventListener('click', async () => {
      const btn = $('request-pause-btn');
      reqCooldown = true;
      btn.disabled = true;
      btn.textContent = '✋ Request Sent!';
      try {
        await sendViewerAction('/api/request-pause');
      } catch (err) {
        console.warn('Pause request failed:', err);
      }
      setTimeout(() => {
        reqCooldown = false;
        render();
      }, 2500);
    });

    $('pause-btn').addEventListener('click', async () => {
      if (!state || !state.active) return;
      const btn = $('pause-btn');
      const wasPaused = Boolean(state.paused);
      btn.disabled = true;
      btn.textContent = wasPaused ? 'Resuming…' : 'Pausing…';
      try {
        await sendViewerAction(wasPaused ? '/api/resume' : '/api/pause');
      } catch (err) {
        console.warn(wasPaused ? 'Resume failed:' : 'Pause failed:', err);
        render();
      }
    });

    $('chat-emoji-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-emoji]');
      if (!btn) return;
      const em = btn.getAttribute('data-emoji') || '';
      const input = $('chat-input');
      const start = input.selectionStart != null ? input.selectionStart : input.value.length;
      const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + em + input.value.slice(end);
      input.focus();
      const cursor = start + em.length;
      try { input.setSelectionRange(cursor, cursor); } catch {}
    });

    $('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('chat-input');
      const text = (input.value || '').trim();
      if (!text) return;
      input.value = '';
      try {
        await sendViewerAction('/api/chat', { text, role: 'viewer' });
      } catch (err) {
        console.warn('Chat send failed:', err);
      }
    });

    if (remoteServer) connectRemote(remoteServer);
    else connectSameOrigin();
    setInterval(render, 250);
  </script>
</body>
</html>
